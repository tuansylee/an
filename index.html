<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Gia đình</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0f1115;--card:#1a1d24;--fg:#e9edf3;--mut:#9aa0aa;--bd:#2a2f3a;
  --r:#ff5a5a;--o:#ffa53a;--y:#ffd84d;--g:#5fd08a;--blue:#3f6fd0;--pink:#c0407f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;
  padding:14px;max-width:1040px;margin:0 auto;user-select:none}
h2{font-size:13px;letter-spacing:.08em;color:var(--mut);margin:16px 4px 8px;text-transform:uppercase}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 4px 10px;
  padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.bar .d{font-size:22px;font-weight:800}.bar .t{font-size:13px;color:var(--mut)}
.lang button{background:#222733;border:1px solid var(--bd);color:var(--mut);padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.lang button.on{background:var(--g);color:#06210f;border-color:var(--g);font-weight:700}
.mockbanner{background:#2a2410;border:1px solid #6a5520;color:#ffd98a;border-radius:10px;padding:8px 12px;font-size:13px;margin:0 4px 10px}
.tabs{display:flex;gap:6px;margin:0 4px 12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:10}
.tabs button{flex:1;background:var(--card);border:1px solid var(--bd);color:var(--mut);padding:11px 4px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;line-height:1.2}
.tabs button.on{background:#1d2740;border-color:var(--blue);color:var(--fg)}
.page{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:820px){.page{grid-template-columns:1fr 1fr;gap:22px;align-items:start}}
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;position:relative}
.cell .ca{font-size:12px;color:var(--mut);letter-spacing:.06em}
.cell .who{font-size:24px;font-weight:800;margin-top:4px}
.bo{background:linear-gradient(155deg,#2a5fd0,#16233a);border-color:var(--blue)}
.me{background:linear-gradient(155deg,#c0407f,#2a1622);border-color:var(--pink)}
.lk{position:absolute;top:5px;right:7px;font-size:12px}
.cell.locked{outline:2px solid #ffd84d88}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.nope{animation:nope .28s}
table{width:100%;border-collapse:separate;border-spacing:5px;margin-top:4px}
th{font-size:11px;color:var(--mut);font-weight:600}th.now{color:var(--fg)}th .dn{display:block;font-size:10px;color:var(--mut)}
td{text-align:center;border-radius:9px;padding:11px 2px;font-size:20px;cursor:pointer;border:1px solid var(--bd);background:var(--card);position:relative}
td.now{outline:2px solid #7da7ff77}.lab{font-size:11px;color:var(--mut);text-align:right;padding-right:4px}
.tdlk{position:absolute;top:0;right:2px;font-size:9px}
.tally{font-size:13px;color:var(--mut);margin:8px 4px}.tally b{color:var(--fg)}
.legend{font-size:12px;color:var(--mut);margin:4px 4px}
.wknav{display:flex;gap:8px;align-items:center;margin:2px 4px 6px}
.wknav button{background:#222733;border:1px solid var(--bd);color:var(--fg);border-radius:9px;padding:9px 12px;font-size:14px;font-weight:700;cursor:pointer}
.wknav #wkLabel{flex:1;color:var(--mut)}
.chk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin:7px 0;cursor:pointer}
.chk .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--mut);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px}
.chk.done .box{background:var(--g);border-color:var(--g);color:#06210f}
.chk .nm{flex:1;font-size:16px}.chk.done .nm{text-decoration:line-through;color:var(--mut)}
.chk .ic{min-width:38px;text-align:center;color:var(--mut);font-size:15px}
.add{width:100%;margin:8px 0 2px;background:#16241a;border:1px dashed #3a5a40;color:#9fe0b0;padding:12px;border-radius:12px;font-size:14px;cursor:pointer}
.empty{color:var(--mut);font-size:14px;margin:8px 4px;text-align:center}
.ic{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;color:var(--mut);font-size:16px;cursor:pointer;flex:none}
.addform{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.addform input,.addform select{background:#0c0e12;border:1px solid var(--bd);color:var(--fg);padding:11px;border-radius:9px;font-size:15px;width:100%}
.addform .frow{display:flex;gap:8px}.addform .frow>*{flex:1}
.addform .fsave{background:var(--g);color:#06210f;border:0;font-weight:700;padding:11px;border-radius:9px;font-size:14px;cursor:pointer}
.addform .fghost{background:#222733;color:var(--mut);border:0;font-weight:700;padding:11px;border-radius:9px;font-size:14px;cursor:pointer}
.hbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hbtn{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 6px;text-align:center;cursor:pointer;font-weight:700}
.hbtn .e{font-size:30px;display:block;margin-bottom:4px}
.hbtn.pain{border-color:#c0407f55}.hbtn.nose{border-color:#ff5a5a55}.hbtn.mood{border-color:#5fd08a55}
.hist{font-size:13px;color:#c7ccd6;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;margin-top:6px}
.hist .row{padding:6px 0;border-top:1px solid var(--bd)}.hist .row:first-child{border-top:0}
.report{width:100%;background:#16241a;border:1px solid #3a5a40;color:#bfe9cc;padding:13px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.gamebox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.bignum{font-size:54px;font-weight:800;text-align:center;line-height:1}.bignum.gold{color:var(--y)}
.gunit{text-align:center;color:var(--mut);font-size:14px;margin-bottom:6px}
.gbreak{text-align:center;color:var(--mut);font-size:12px;margin-bottom:8px}
.done{text-align:center;color:var(--g);font-weight:700;margin-bottom:6px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.gbtn{border:0;border-radius:9px;padding:10px 2px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;line-height:1.25}
.g_cn{background:#16a34a}.g_n{background:#65a30d}.g_bt{background:#64748b}.g_h{background:#ea580c}.g_ch{background:#dc2626}
.gbtn.sel{outline:3px solid #fff;outline-offset:1px}
.gstatus{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
.critbtn{width:100%;margin-top:10px;background:#222733;border:1px solid var(--bd);color:var(--mut);padding:10px;border-radius:9px;font-size:13px;cursor:pointer}
.gumbtn{width:100%;margin-top:8px;border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer}
.gumbtn.indigo{background:#4f46e5;color:#fff}.gumbtn.gold2{background:#d97706;color:#fff}.gumbtn.ghost{background:#222733;color:var(--mut)}
#ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:600px){#ov{align-items:center}}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:18px}
@media(min-width:600px){.sheet{border-radius:18px}}
.sheet h3{margin:0 0 12px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{background:#0c0e12;border:1px solid var(--bd);color:var(--fg);padding:9px 13px;border-radius:20px;font-size:14px;cursor:pointer}
.chip.sel{background:var(--g);color:#06210f;border-color:var(--g);font-weight:700}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:4px 0 2px}
.sheet textarea{width:100%;background:#0c0e12;border:1px solid var(--bd);color:var(--fg);border-radius:9px;padding:10px;font:14px/1.4 system-ui;margin-top:6px}
.sheet input{width:100%;background:#0c0e12;border:1px solid var(--bd);color:var(--fg);border-radius:9px;padding:11px;font-size:16px;margin-top:4px}
.sheet .acts{display:flex;gap:8px;margin-top:14px}
.sheet .acts button{flex:1;padding:13px;border-radius:10px;border:0;font-weight:700;font-size:15px;cursor:pointer}
.save{background:var(--g);color:#06210f}.cancel{background:#222733;color:var(--mut)}
.notebtn{background:#0c0e12;border:1px dashed var(--bd);color:var(--mut);padding:9px;border-radius:9px;width:100%;cursor:pointer;font-size:13px;margin-top:4px}
.rep th,.rep td{border:1px solid var(--bd);padding:6px 8px;text-align:left;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin:10px 0 22px;border-bottom:1px solid var(--bd);padding-bottom:2px}
.bars .b{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.bars .b span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.foot{margin:22px 4px;color:var(--mut);font-size:12px;text-align:center}
.neg{color:var(--r)!important}
.wallets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.wallet{border-radius:18px;padding:14px;text-align:center}
.wallet.sao{background:linear-gradient(155deg,#2a2410,#1a1d24);border:1px solid #6a5520}
.wallet.keo{background:linear-gradient(155deg,#241033,#161022);border:1px solid #5a3a7a}
.wallet .n{font-size:32px;font-weight:800;line-height:1.1}
.wallet.sao .n{color:var(--y)}.wallet.keo .n{color:#c99bff}
.wallet .sub{font-size:13px;margin-top:2px;color:#cfd3db}
.hand{background:linear-gradient(155deg,#1b2740,#12182a);border:2px solid var(--blue);border-radius:18px;padding:14px;text-align:center;margin:10px 0}
.hand .big{font-size:28px;font-weight:800}
.hand .q{font-size:15px;font-weight:700;margin-bottom:8px}
.hand .cnt{font-size:14px;color:#cfe0ff;margin-bottom:10px}
.handbtn{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:800;cursor:pointer;width:100%}
.shopbuy{opacity:.55}
.wallets4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.wallets4{grid-template-columns:repeat(4,1fr)}}
.wallet.whand{background:linear-gradient(155deg,#1b2740,#12182a);border:1px solid var(--blue)}.wallet.whand .n{color:#9cc0ff}
.wallet.money{background:linear-gradient(155deg,#102a1e,#102216);border:1px solid #3a5a40}.wallet.money .n{color:#5fd08a}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.shopbig{background:linear-gradient(155deg,#241033,#161022);border:2px solid #7a4fb0;border-radius:16px;padding:14px 8px;color:var(--fg);cursor:pointer;text-align:center;font:inherit;line-height:1.25}
.shopbig .e{font-size:34px;display:block;line-height:1.1}
.shopbig .nm{font-size:16px;font-weight:800;margin-top:4px;display:block}
.shopbig .cost{font-size:14px;color:#e4cfff;margin-top:4px;display:block}
.kidrule{font-size:12.5px;color:var(--mut);margin:-4px 2px 8px}
.kidwarn{background:#2a2410;border:1px solid #6a5520;color:#ffd98a;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;text-align:center;margin:8px 0}
.convrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.convrow .gumbtn{flex:1 1 150px;width:auto;margin:0}
.gumbtn:disabled{opacity:.45;cursor:default}
.hday{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;font-weight:800;color:var(--fg);letter-spacing:.03em;margin:14px 2px 4px}
.hday .sum{font-weight:700;color:var(--mut)}
.hist .row .tm{color:var(--mut);font-size:12px;margin-right:4px}
.histtools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.histtools input{flex:1 1 160px;background:#0c0e12;border:1px solid var(--bd);color:var(--fg);border-radius:10px;padding:10px;font-size:14px;min-width:0}
.histtools input[type=date]{flex:0 1 170px}
.histtools button{background:#222733;border:1px solid var(--bd);color:var(--fg);border-radius:10px;padding:9px 12px;font-size:13px;cursor:pointer}
/* ===== View của Con (Kid mode) ===== */
#kidPanel{background:linear-gradient(165deg,#1a1530,#12131f 55%,#10211a);border:1px solid var(--bd);border-radius:18px;padding:16px}
.kidtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.kidav{font-size:34px;cursor:pointer;line-height:1;width:60px;height:60px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--kidc,#5fd08a)}
.kidhi{flex:1;font-size:22px;font-weight:800}
.kidclose{background:#222733;border:1px solid var(--bd);color:var(--fg);border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}
.kidstar{background:linear-gradient(155deg,#2a2410,#1a1d24);border:1px solid #6a5520;border-radius:18px;padding:14px;text-align:center;margin-bottom:8px}
.kidstar .n{font-size:34px;font-weight:800;color:var(--y);line-height:1.1}
.kidstar .sub{font-size:14px;color:#ffd98a;margin-top:2px}
.kidcheer{background:#16241a;border:1px solid #3a5a40;color:#bfe9cc;border-radius:14px;padding:12px;text-align:center;font-weight:800;margin-bottom:10px;animation:pop .4s}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.kidask{background:linear-gradient(155deg,#16241a,#0f1d14);border:2px solid var(--g);border-radius:18px;padding:16px;margin-bottom:12px;text-align:center;animation:pop .4s}
.kidask .q{font-size:18px;font-weight:800;margin-bottom:12px;line-height:1.3}
.kidask .askyes{flex:2;background:var(--g);color:#06210f;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:800;cursor:pointer}
.kidask .askno{flex:1;background:#222733;color:var(--mut);border:0;border-radius:14px;padding:16px;font-size:13px;font-weight:700;cursor:pointer}
.kidbadges{display:flex;gap:8px;overflow-x:auto;margin-bottom:6px;padding-bottom:2px}
.kidbadge{flex:0 0 auto;background:#1b1f27;border:1px solid var(--bd);border-radius:14px;padding:8px 10px;text-align:center;font-size:24px;min-width:66px;opacity:.45}
.kidbadge span{display:block;font-size:11px;color:var(--mut);margin-top:2px;font-weight:700}
.kidbadge.got{opacity:1;background:linear-gradient(155deg,#2a2410,#1a1d24);border-color:#6a5520}
.kidbadge.got span{color:#ffd98a}
.kcolor{width:30px;height:30px;border-radius:50%;cursor:pointer;display:inline-block}
.kcolor.sel{outline:3px solid #fff;outline-offset:2px}
.kidsec{margin:16px 2px 8px;font-size:14px;color:var(--mut);font-weight:700}
.kidmood{display:flex;gap:8px}
.kidmood button{flex:1;font-size:30px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 0;cursor:pointer}
.kidmood button.sel{outline:3px solid var(--g);outline-offset:1px}
.kidrow{display:flex;gap:8px;margin-top:6px}
.kidrow input{flex:1;background:#0c0e12;border:1px solid var(--bd);color:var(--fg);border-radius:12px;padding:12px;font-size:15px}
.kidrow button{background:var(--g);color:#06210f;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
.kidavpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.kidavpick span{font-size:30px;cursor:pointer;padding:4px;border-radius:10px}
.kidavpick span.sel{background:#2a3550;outline:2px solid var(--blue)}
/* ===== Tối giản ban đêm ===== */
#night{position:fixed;inset:0;z-index:80;background:#000;color:#3a3f4a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;cursor:pointer;user-select:none}
#night .clock{font-size:84px;font-weight:800;letter-spacing:3px;line-height:1}
#night .nd{font-size:18px;color:#2c303a}
#night .nh{position:absolute;bottom:26px;font-size:12px;color:#23262e}
#nightBtn{background:#222733;border:1px solid var(--bd);color:var(--mut);padding:6px 10px;border-radius:8px;font-size:15px;cursor:pointer}
/* ===== Sức khỏe: tổng quan hôm nay · gần đây (sửa/xoá) · form ngày+giờ · báo cáo ===== */
button.hbtn{color:var(--fg);font:inherit;font-weight:700;width:100%;min-height:84px}
.hbtn.temp{border-color:#ffa53a55}.hbtn.sleep{border-color:#3f6fd055}.hbtn.growth{border-color:#a855f755}
.hsum{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.hsum .hp{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hsum .hpt{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.hpill{background:#0c0e12;border:1px solid var(--bd);border-radius:20px;padding:4px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.hpill.z{opacity:.45;font-weight:400}
.hsum .hl{font-size:13px;color:#c7ccd6;margin-top:7px}
.hsum .hl.fev{color:var(--r)}.hsum .hl.old{opacity:.6}
@media(max-width:420px){.hsum .hp{gap:5px}.hpill{padding:3px 7px;font-size:13px}.hsum .hpt{letter-spacing:0}}
.hist .row.hday{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.04em;padding-top:10px}
.hist .row.hrow{display:flex;align-items:center;gap:4px;padding:2px 0}
.hrow .htm{flex:none;width:42px;color:var(--mut);font-variant-numeric:tabular-nums}
.hrow .htx{flex:1;min-width:0;overflow-wrap:anywhere}
.hrow .fev,.hrep .fev{color:var(--r);font-weight:700}
.hic{flex:none;min-width:40px;min-height:40px;background:transparent;border:0;border-radius:9px;color:var(--mut);font-size:16px;cursor:pointer}
.hic:active{background:#222733}
.hform .hdt{display:flex;gap:8px}.hform .hdt>div{flex:1;min-width:0}
.hform input{color-scheme:dark}
.hform .chip{font:inherit;font-size:14px;min-height:42px}
.hform .chips.hq{margin:8px 0 6px}.hform .chips.hq .chip{min-height:40px;padding:7px 12px;font-size:13px;color:var(--mut)}
.hform .chips.hmiss{outline:2px solid var(--r);outline-offset:3px;border-radius:12px}
.hform input.hbad{border-color:var(--r)}
.hform .hhint{font-size:12px;color:var(--mut);margin:-8px 0 10px}
.hform .herr{color:var(--r);font-size:14px;font-weight:700;min-height:1.3em;margin-top:8px}
.sheet:has(.hrep){max-width:900px}
.hrep .chips .chip{font:inherit;font-size:14px;min-height:42px}
.hrep h4{font-size:14px;margin:16px 0 6px}
.hrep .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hrep table{border-collapse:collapse;border-spacing:0;width:100%;margin:4px 0 10px}
.hrep th,.hrep td{cursor:auto;border-radius:0;background:transparent;vertical-align:top}
.hrep th{color:var(--mut);font-weight:600}
.hrep .mut{color:var(--mut);font-size:13px}
.hrep .bars{margin-top:24px}
.hrep .bars .b i{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:10px;font-style:normal;color:#c7ccd6}
.hrep .acts{position:sticky;bottom:-18px;background:var(--card);padding:10px 0 14px;margin-top:8px}
@media print{#printArea .mut{color:#444}#printArea .fev{font-weight:700}#printArea tr{break-inside:avoid}#printArea h3{break-after:avoid}#printArea p{margin:4px 0}#printArea th,#printArea td{background:#fff;border-radius:0;cursor:auto;vertical-align:top}}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;max-width:none}
  body>*{display:none!important}

function getStorageUsage() {
  let total = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k) total += k.length + (localStorage.getItem(k) || "").length;
  }
  const kb = total / 1024;
  const pct = (kb / 5000) * 100;
  return { kb: Math.round(kb), pct: Math.round(pct) };
}

function triggerConfetti() {
  const canvas = document.createElement('canvas');
  canvas.style.position = 'fixed';
  canvas.style.inset = '0';
  canvas.style.width = '100vw';
  canvas.style.height = '100vh';
  canvas.style.pointerEvents = 'none';
  canvas.style.zIndex = '9999';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;
  
  const particles = [];
  const colors = ['#ffd84d', '#5fd08a', '#3f6fd0', '#c0407f', '#ffa53a', '#ff5a5a'];
  for (let i = 0; i < 100; i++) {
    particles.push({
      x: Math.random() * width,
      y: Math.random() * height - height,
      r: Math.random() * 4 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      tilt: Math.random() * 10 - 5,
      tiltAngleIncremental: Math.random() * 0.07 + 0.02,
      tiltAngle: 0,
      vy: Math.random() * 4 + 3,
      vx: Math.random() * 2 - 1
    });
  }

  let animationFrameId;
  function draw() {
    ctx.clearRect(0, 0, width, height);
    let active = false;
    particles.forEach(p => {
      p.tiltAngle += p.tiltAngleIncremental;
      p.y += p.vy;
      p.x += p.vx + Math.sin(p.tiltAngle) * 0.5;
      
      if (p.y < height) {
        active = true;
        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
        ctx.stroke();
      }
    });

    if (active) {
      animationFrameId = requestAnimationFrame(draw);
    } else {
      cancelAnimationFrame(animationFrameId);
      canvas.remove();
    }
  }
  draw();
}

let _audioCtx = null;
function playSound(type) {
  try {
    if (!_audioCtx) {
      _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    const ctx = _audioCtx;
    if (ctx.state === 'suspended') {
      ctx.resume();
    }
    if (type === 'success') {
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
        gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.35);
        osc.start(ctx.currentTime + i * 0.1);
        osc.stop(ctx.currentTime + i * 0.1 + 0.4);
      });
    } else if (type === 'click') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.2);
    }
  } catch (e) {
    console.error("AudioContext error:", e);
  }
}

const fmtInterest=val=>{
  const cents=Number((val*100).toFixed(6));
  const unit=LANG==="de"?"Cent":"cent";
  if(cents<100){
    if(cents===0)return "0 "+unit;
    if(cents<0.01)return cents.toFixed(4)+" "+unit;
    return cents.toFixed(2)+" "+unit;
  }
  return val.toFixed(2)+" €";
};

const PEOPLE={bo:{c:"bo",e:"🧔"},me:{c:"me",e:"👩‍🦰"}};
const TEMPLATE=[
 { 0:{sang:"me",chieu:"me"},1:{sang:"bo",chieu:"me"},2:{sang:"bo",chieu:"me"},
   3:{sang:"me",chieu:"bo"},4:{sang:"bo",chieu:"bo"},5:{sang:"me",chieu:"me"},6:{sang:"bo",chieu:"bo"} },
 { 0:{sang:"me",chieu:"me"},1:{sang:"me",chieu:"bo"},2:{sang:"bo",chieu:"me"},
   3:{sang:"me",chieu:"bo"},4:{sang:"bo",chieu:"bo"},5:{sang:"me",chieu:"me"},6:{sang:"bo",chieu:"bo"} }];
const SHIFTS=[{k:"sang"},{k:"chieu"}];
function mondayOf(d){const x=new Date(d);const wd=(x.getDay()+6)%7;x.setDate(x.getDate()-wd);x.setHours(0,0,0,0);return x;}
const EPOCH=mondayOf(new Date(2026,5,15));
function weekParity(d){return ((Math.round((mondayOf(d)-EPOCH)/(7*864e5))%2)+2)%2;}
const baseOwner=(d,sk)=>TEMPLATE[weekParity(d)][d.getDay()][sk];
let weekOffset=0;
function dispMon(){const m=mondayOf(new Date());m.setDate(m.getDate()+weekOffset*7);return m;}
const ovKey=(d,sk)=>"fam.ov."+iso(d)+"|"+sk, lkKey=(d,sk)=>"fam.lk."+iso(d)+"|"+sk;
const owner=(d,sk)=>localStorage.getItem(ovKey(d,sk))||baseOwner(d,sk);
// Ca đã qua = TỰ KHOÁ. Sáng hết 13:00, Chiều hết cuối ngày (24:00).
const SANG_END_HOUR=13;
function slotPast(d,sk){const end=new Date(d);end.setHours(sk==="sang"?SANG_END_HOUR:24,0,0,0);return new Date()>end;}
function isLocked(d,sk){const v=localStorage.getItem(lkKey(d,sk));
  if(v==="1")return true;if(v==="0")return false;return slotPast(d,sk);}   // mặc định: ca đã qua = khoá
function toggle(d,sk){if(isLocked(d,sk))return;const other=owner(d,sk)==="bo"?"me":"bo";
  if(!confirm(LANG==="vi"?"Xác nhận thay đổi người trực ca này?":"Diensthabenden für diese Schicht ändern?"))return;
  if(other===baseOwner(d,sk))localStorage.removeItem(ovKey(d,sk));else localStorage.setItem(ovKey(d,sk),other);renderDuty();}
function toggleLock(d,sk){const next=!isLocked(d,sk),def=slotPast(d,sk);   // giữ 0.5s: khoá/mở (mở lại được cả ca đã qua)
  if(!confirm(LANG==="vi"?"Khóa hoặc mở khóa ca trực này?":"Sperrung dieser Schicht ändern?"))return;
  if(next===def)localStorage.removeItem(lkKey(d,sk));else localStorage.setItem(lkKey(d,sk),next?"1":"0");renderDuty();}
function cellHtml(d,sk){const o=owner(d,sk),p=PEOPLE[o];
  return `<div class="cell ${p.c}${isLocked(d,sk)?' locked':''}" data-d="${iso(d)}" data-s="${sk}">
    ${isLocked(d,sk)?'<span class="lk">🔒</span>':''}
    <div class="ca">${sk==="sang"?L().sang:L().chieu}</div>
    <div class="who">${p.e} ${o==="bo"?L().bo:L().me}</div></div>`;}
function renderDuty(){
  const now=new Date();
  $("dateLbl").textContent=L().dayShort[now.getDay()]+" · "+iso(now).split("-").reverse().join("/");
  $("weekLbl").textContent=(weekParity(now)===0?L().weekA:L().weekB);
  $("todayCard").innerHTML=SHIFTS.map(s=>cellHtml(now,s.k)).join("");
  const mon=dispMon();const sun=new Date(mon);sun.setDate(mon.getDate()+6);
  $("wkLabel").textContent=(weekParity(mon)===0?L().weekA:L().weekB)+" · "+mon.getDate()+"/"+(mon.getMonth()+1)+"–"+sun.getDate()+"/"+(sun.getMonth()+1)+(weekOffset?(weekOffset>0?" ▶":" ◀"):"");
  let head="<tr><th></th>";
  let rows=SHIFTS.map(s=>`<tr><td class="lab">${s.k==="sang"?L().sang:L().chieu}</td>`);
  const tal={bo:0,me:0};
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const nowD=iso(d)===iso(now);
    head+=`<th class="${nowD?'now':''}">${L().dayShort[d.getDay()]}<span class="dn">${d.getDate()}/${d.getMonth()+1}</span></th>`;
    SHIFTS.forEach((s,si)=>{const o=owner(d,s.k),p=PEOPLE[o];tal[o]++;
      rows[si]+=`<td class="${p.c} ${nowD?'now':''}" data-d="${iso(d)}" data-s="${s.k}">
        ${isLocked(d,s.k)?'<span class="tdlk">🔒</span>':''}${p.e}</td>`;});}
  $("weekGrid").innerHTML=head+"</tr>"+rows.map(r=>r+"</tr>").join("");
  $("tally").innerHTML=L().tally(tal);$("legend").textContent=L().legend;}
let pt=null,lp=false,pe=null;
document.addEventListener("pointerdown",e=>{const el=e.target.closest(".cell[data-d],td[data-d]");if(!el)return;pe=el;lp=false;
  pt=setTimeout(()=>{lp=true;toggleLock(new Date(el.dataset.d+"T00:00:00"),el.dataset.s);},500);});
document.addEventListener("pointerup",e=>{clearTimeout(pt);const el=e.target.closest(".cell[data-d],td[data-d]");if(!el)return;
  if(lp){lp=false;return;}if(el!==pe)return;const d=new Date(el.dataset.d+"T00:00:00"),sk=el.dataset.s;
  if(isLocked(d,sk)){el.classList.remove("nope");void el.offsetWidth;el.classList.add("nope");return;}toggle(d,sk);});
document.addEventListener("pointercancel",()=>clearTimeout(pt));
document.querySelectorAll("[data-wkrel]").forEach(b=>b.onclick=()=>{weekOffset+=parseInt(b.dataset.wkrel,10);renderDuty();});
$("wkLabel").onclick=()=>{weekOffset=0;renderDuty();};

/* ============ Log sức khỏe ============
   Mọi bản ghi: date "YYYY-MM-DD" + time "HH:MM" (tuỳ chọn, bản ghi cũ không có). fam.sleep: time = giờ dậy. */
const HKEY={pain:"fam.health.logs",nose:"fam.health.logs",mood:"fam.health.logs",sleep:"fam.sleep",temp:"fam.temp",growth:"fam.growth"};
const HEMO={pain:"🤕",nose:"🩸",mood:"🙂",sleep:"😴",temp:"🌡️",growth:"📈"};
const hhmm=d=>String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
const hSort=x=>(x.date||"")+" "+(x.time||"");   // ngày + giờ; bản ghi không có giờ xếp cuối ngày đó
const hNum=(v,lang)=>v==null||v===""?"":String(v).replace(".",(lang||LANG)==="de"?",":".");
const hLabel=k=>({pain:L().pain,nose:L().nose,mood:L().mood,sleep:SL().bSleep,temp:SL().bTemp,growth:SL().bGrowth})[k]||k;
const hAgoDays=ds=>Math.round((new Date(iso(new Date())+"T00:00:00")-new Date(ds+"T00:00:00"))/864e5);
const hAgo=ds=>{const n=hAgoDays(ds);return n>=0?SL().ago(n):dd(ds);};
// Nhãn chip lưu theo ngôn ngữ lúc nhập (vd "Đầu") -> đổi sang ngôn ngữ cần hiển thị (vd "Kopf"); lạ thì giữ nguyên.
function hTr(arr,val,lang){if(val==null||val==="")return "";
  const lst=lg=>T[lg][arr]||SX[lg][arr]||[];
  for(const lg of ["vi","de"]){const i=lst(lg).indexOf(val);if(i>=0)return lst(lang||LANG)[i];}
  return String(val);}
function addLog(o){const a=ld("fam.health.logs"),now=new Date();a.push({id:newId(),date:iso(now),time:hhmm(now),...o});sv("fam.health.logs",a);renderHealth();}
function summ(x){let s;
  if(x.type==="pain")s=`🤕 ${esc(hTr("bodyparts",x.part))} · ${L().level} ${esc(x.level)}/5`;
  else if(x.type==="nose")s="🩸 "+[hTr("amounts",x.amount),x.duration,hTr("sides",x.side)].filter(Boolean).map(esc).join(" · ");
  else if(x.type==="mood"){const m=hTr("moods",x.mood);s=(!m||/^\p{L}/u.test(m)?"🙂 ":"")+esc(m);}   // nhãn cảm xúc đã có emoji riêng
  else s="🩺 "+esc(x.type);
  if(x.note)s+=` · "${esc(x.note)}"`;return s;}
// Một dòng mô tả (HTML an toàn, không gồm giờ) cho mọi loại bản ghi sức khỏe
function hText(kind,x){const S=SL();
  if(kind==="sleep"){const h=durH(x.bed,x.wake);
    return `😴 ${esc(x.bed||"–")}→${esc(x.wake||"–")}${h?` · ${hNum(h)} ${S.dur}`:""}${x.quality?` · ${esc(hTr("qualities",x.quality))}`:""}${x.note?` · "${esc(x.note)}"`:""}`;}
  if(kind==="temp"){const f=+x.v>=38;
    return `<span${f?' class="fev"':""}>🌡️ ${esc(hNum(x.v))} °C${f?` (${S.fever})`:""}</span>${x.note?` · "${esc(x.note)}"`:""}`;}
  if(kind==="growth")return `📈 ${x.h?esc(hNum(x.h))+" cm":"–"} · ${x.w?esc(hNum(x.w))+" kg":"–"}`;
  return summ(x);}
// Gộp mọi nguồn sức khỏe, mới nhất trước. ref = id, hoặc "@vị trí" cho bản ghi cũ chưa có id (không ghi id vào máy khi chỉ xem).
function hAll(){const out=[];
  const add=(key,kind)=>{const a=ld(key);(Array.isArray(a)?a:[]).forEach((x,i)=>{if(x&&typeof x==="object"&&x.date)
    out.push({key,kind:kind||x.type,x,i,ref:x.id!=null&&x.id!==""?String(x.id):"@"+i});});};
  add("fam.health.logs");add("fam.sleep","sleep");add("fam.temp","temp");add("fam.growth","growth");
  return out.sort((a,b)=>hSort(b.x).localeCompare(hSort(a.x))||b.i-a.i);}
function hFind(key,ref){const a=ld(key),r=String(ref);let i=-1;
  if(r.charAt(0)==="@"){const j=+r.slice(1);if(a[j]&&(a[j].id==null||a[j].id===""))i=j;}
  else i=a.findIndex(x=>x&&String(x.id)===r);
  return {a,i};}
// Lưu: ref rỗng -> thêm cuối mảng; có ref -> thay tại chỗ, giữ id (bản ghi cũ chưa có id thì cấp lúc sửa)
function hSave(key,entry,ref){const f=ref!=null?hFind(key,ref):{a:ld(key),i:-1};
  if(f.i>=0){const old=f.a[f.i];f.a[f.i]=Object.assign({},old,entry,{id:old.id!=null&&old.id!==""?old.id:newId()});}
  else f.a.push(Object.assign({id:newId()},entry));
  sv(key,f.a);renderHealth();}
function hDel(key,ref){if(!confirm(SL().delAsk))return;const r=String(ref);
  if(r.charAt(0)==="@"){const f=hFind(key,r);if(f.i<0)return;f.a.splice(f.i,1);sv(key,f.a);}
  else sv(key,ld(key).filter(x=>!(x&&String(x.id)===r)));
  renderHealth();}
function hDayName(ds){const S=SL(),n=hAgoDays(ds),d=new Date(ds+"T00:00:00");
  const base=`${S.wd[d.getDay()]||""} ${dd(ds).slice(0,6)}${ds.slice(0,4)!==String(new Date().getFullYear())?ds.slice(0,4):""}`;
  return n===0?`${S.today} · ${base}`:n===1?`${S.yest} · ${base}`:base;}
let hDays=14;   // cửa sổ "Gần đây" (số ngày), "xem thêm" +30
function renderHealth(){
  $("h_health").textContent=L().health;$("b_pain").textContent=L().pain;$("b_nose").textContent=L().nose;$("b_mood").textContent=L().mood;
  const all=hAll();hRenderSummary(all);hRenderRecent(all);}
function hRenderSummary(all){const S=SL(),today=iso(new Date());
  const td=all.filter(e=>e.x.date===today),cnt=k=>td.filter(e=>e.kind===k).length;
  const sl=td.find(e=>e.kind==="sleep"),slH=sl?durH(sl.x.bed,sl.x.wake):null;
  const pill=(k,v,z)=>`<span class="hpill${z?" z":""}" title="${esc(hLabel(k))}">${HEMO[k]} ${v}</span>`;
  let h=`<div class="hp"><span class="hpt">${S.today}</span>`+["pain","nose","mood","temp"].map(k=>pill(k,cnt(k),!cnt(k))).join("")
    +pill("sleep",slH?hNum(slH)+" "+S.dur:"–",!sl)+`</div>`;
  const lt=all.find(e=>e.kind==="temp"&&isFinite(parseFloat(e.x.v)));
  if(lt){const v=+lt.x.v,f=v>=38;
    h+=`<div class="hl${f?" fev":""}${hAgoDays(lt.x.date)>3?" old":""}">🌡️ ${S.lastTemp}: <b>${esc(hNum(v))} °C</b>${f?` (${S.fever})`:""} · ${hAgo(lt.x.date)}${lt.x.time?" "+esc(lt.x.time):""}</div>`;}
  const ln=all.find(e=>e.kind==="nose"),n30=all.filter(e=>e.kind==="nose"&&hAgoDays(e.x.date)<30).length;
  h+=`<div class="hl">🩸 ${ln?`${S.lastNose}: <b>${hAgo(ln.x.date)}</b> (${dd(ln.x.date).slice(0,6)}${ln.x.time?" "+esc(ln.x.time):""}) · ${S.n30(n30)}`:S.noNose}</div>`;
  $("hSummary").innerHTML=h;}
function hRenderRecent(all){const S=SL(),c=new Date();c.setDate(c.getDate()-(hDays-1));const ci=iso(c);
  const shown=all.filter(e=>e.x.date>=ci);let h="",last="";
  shown.forEach(e=>{if(e.x.date!==last){last=e.x.date;h+=`<div class="row hday">${esc(hDayName(last))}</div>`;}

      +(HKEY[e.kind]?`<button class="hic" data-hact="ed" title="${S.edit}" aria-label="${S.edit}">✏️</button>`:"")
      +`<button class="hic" data-hact="del" title="${S.del}" aria-label="${S.del}">✕</button></div>`;});
  $("h_recent").textContent=S.recent;
  $("hRecent").innerHTML=h||`<div class="row" style="color:var(--mut)">${S.noRecent(hDays)}</div>`;
  $("hMore").hidden=shown.length===all.length;$("hMore").textContent=S.more;}
$("hRecent").addEventListener("click",e=>{const b=e.target.closest("[data-hact]");if(!b)return;const r=b.closest(".hrow");

        <div class="chips" style="margin:6px 0 10px"><span class="chip" data-femoji="${f.key}" data-fclear="1">✕ ${esc(L().emojiNone)}</span>${EMOJI_SUGGEST.map(e=>`<span class="chip" data-femoji="${f.key}">${e}</span>`).join("")}</div>`;}
    if(f.type==="textarea")return lbl+`<textarea id="ff_${f.key}" placeholder="${esc(f.placeholder||"")}">${esc(v)}</textarea>`;

    return lbl+`<input id="ff_${f.key}" type="${f.type||"text"}" value="${esc(v)}" placeholder="${esc(f.placeholder||"")}"${extra}>`;};
  open(`<h3>${esc(cfg.title||"")}</h3><div class="addform" style="border:0;padding:0;margin:0;background:transparent">${F.map(fieldHtml).join("")}</div>
    <div class="acts"><button class="cancel" id="fCancel">${L().cancel}</button><button class="save" id="fSave">${L().save}</button></div>`);
  const chipVals={};F.forEach(f=>{if(f.type==="chips")chipVals[f.key]=f.value==null?null:String(f.value);});
  sheet.querySelectorAll("[data-fchip]").forEach(c=>c.onclick=()=>{
    sheet.querySelectorAll(`[data-fchip="${c.dataset.fchip}"]`).forEach(x=>x.classList.remove("sel"));
    c.classList.add("sel");chipVals[c.dataset.fchip]=c.dataset.fval;});
  sheet.querySelectorAll("[data-femoji]").forEach(c=>c.onclick=()=>{const inp=$("ff_"+c.dataset.femoji);if(inp)inp.value=c.dataset.fclear?"":c.textContent;});
  $("fCancel").onclick=()=>{close();if(back)back();};
  $("fSave").onclick=()=>{
    const out={};let ok=true;
    F.forEach(f=>{
      let val;
      if(f.type==="chips")val=chipVals[f.key];
      else{const el=$("ff_"+f.key);val=el?el.value:"";
        if(f.type!=="textarea")val=(val||"").trim();
        if(f.type==="number"){val=val===""?null:parseFloat(val);if(val!=null&&isNaN(val))val=null;}}
      if(f.required&&(val==null||val==="")){ok=false;const el=$("ff_"+f.key);if(el){el.style.borderColor="var(--r)";el.focus();}}
      out[f.key]=val;});
    if(!ok)return;
    close();cfg.onSave(out);if(back)back();};
  const first=sheet.querySelector("input[type=text],input[type=number],textarea");if(first)first.focus();}
/* --- Form nhập/sửa sức khỏe (riêng, vì cần: ngày+giờ cùng hàng, chip bắt buộc báo lỗi rõ, xác nhận số lạ) ---
   Mặc định = bây giờ; sửa ngày/giờ để ghi bù. Sửa bản ghi: cùng form, điền sẵn, giữ id. */
function hChips(key,label,opts,val,req){opts=opts.map(o=>Array.isArray(o)?o:[o,o]);
  if(val&&!opts.some(o=>String(o[0])===String(val)))opts.push([val,val]);   // giá trị lạ (dữ liệu cũ) vẫn giữ được khi sửa
  return `<div class="lbl">${esc(label)}${req?" *":""}</div><div class="chips" data-hgrp="${key}" data-hlbl="${esc(label)}">`
    +opts.map(o=>`<button type="button" class="chip${val!=null&&String(val)===String(o[0])?" sel":""}" data-hc="${esc(o[0])}">${esc(o[1])}</button>`).join("")+`</div>`;}
function hDT(x,withTime,dateLbl){const S=SL(),now=new Date();
  return `<div class="hdt"><div><div class="lbl">${dateLbl||S.date} *</div><input id="hfD" type="date" value="${esc(x?x.date:iso(now))}" max="${iso(now)}"></div>`
    +(withTime?`<div><div class="lbl">${S.time}</div><input id="hfT" type="time" value="${esc(x?(x.time||""):hhmm(now))}"></div>`:"")+`</div>`
    +`<div class="chips hq"><button type="button" class="chip" data-hq="0">${withTime?S.now:S.today}</button><button type="button" class="chip" data-hq="1">${S.yest}</button></div>`;}
const hNoteF=x=>{const n=x&&x.note?x.note:"";
  return `<button type="button" class="notebtn" id="hfNB"${n?" hidden":""}>${L().addnote}</button><textarea id="hfN" placeholder="${esc(L().notePh)}"${n?"":" hidden"}>${esc(n)}</textarea>`;};
// build(g) -> object (lưu) | string (báo lỗi, giữ form) | false (người dùng huỷ ở hộp xác nhận)
function hSheet(kind,ref,title,body,opt,build){const S=SL();
  open(`<div class="hform"><h3>${title}</h3>${body}<div class="herr" id="hfE" role="alert"></div>
    <div class="acts"><button class="cancel" id="hfC">${L().cancel}</button><button class="save" id="hfS">${L().save}</button></div></div>`);
  const pick={};
  sheet.querySelectorAll("[data-hgrp]").forEach(gr=>{const s=gr.querySelector(".chip.sel");pick[gr.dataset.hgrp]=s?s.dataset.hc:null;
    gr.querySelectorAll("[data-hc]").forEach(c=>c.onclick=()=>{const on=!c.classList.contains("sel");   // chạm lại = bỏ chọn
      gr.querySelectorAll(".chip").forEach(z=>z.classList.remove("sel"));if(on)c.classList.add("sel");
      pick[gr.dataset.hgrp]=on?c.dataset.hc:null;gr.classList.remove("hmiss");});});
  sheet.querySelectorAll("[data-hq]").forEach(c=>c.onclick=()=>{const d=new Date();if(c.dataset.hq==="1")d.setDate(d.getDate()-1);
    $("hfD").value=iso(d);if(c.dataset.hq==="0"&&$("hfT"))$("hfT").value=hhmm(d);});
  if($("hfNB"))$("hfNB").onclick=()=>{$("hfNB").hidden=true;$("hfN").hidden=false;$("hfN").focus();};
  const val=id=>{const el=$(id);return el?el.value.trim():"";};
  const g={pick:k=>pick[k],val,
    bad:id=>{const el=$(id);if(el){el.classList.add("hbad");el.focus();}},
    need:keys=>{const miss=keys.filter(k=>!pick[k]).map(k=>sheet.querySelector(`[data-hgrp="${k}"]`));
      miss.forEach(el=>el.classList.add("hmiss"));
      if(miss.length)miss[0].scrollIntoView({block:"center",behavior:"smooth"});
      return miss.length?S.errReq+" "+miss.map(el=>el.dataset.hlbl).join(", "):"";}};
  $("hfC").onclick=close;
  $("hfS").onclick=()=>{$("hfE").textContent="";sheet.querySelectorAll(".hbad").forEach(el=>el.classList.remove("hbad"));
    const date=val("hfD");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){g.bad("hfD");$("hfE").textContent=S.errDate;return;}
    if(date>iso(new Date())){g.bad("hfD");$("hfE").textContent=S.errFuture;return;}
    const r=build(g);
    if(typeof r==="string"){$("hfE").textContent=r;return;}
    if(!r)return;
    r.date=date;
    if(opt.time){const t=val("hfT");r.time=/^\d{2}:\d{2}/.test(t)?t.slice(0,5):undefined;}
    if($("hfN"))r.note=val("hfN")||undefined;
    close();hSave(HKEY[kind],r,ref);};
  if(opt.after)opt.after();}
// Mở form cho 1 loại (pain|nose|mood|temp|sleep|growth); ref = sửa bản ghi đó
function hOpen(kind,ref){if(typeof kind!=="string"||!HKEY[kind])return;
  let x=null;if(ref!=null){const f=hFind(HKEY[kind],ref);if(f.i<0){renderHealth();return;}x=f.a[f.i];}
  const S=SL(),Lx=L(),title=(x?"✏️ ":"")+HEMO[kind]+" "+esc(hLabel(kind)),T1={time:true};
  const numIn=(id,lbl,v,ph)=>`<div><div class="lbl">${lbl}</div><input id="${id}" type="text" inputmode="decimal" autocomplete="off" placeholder="${esc(ph)}" value="${v!=null&&v!==""?esc(hNum(v)):""}"></div>`;
  const num=s=>{s=s.replace(",",".");if(!s)return null;return /^\d+(\.\d+)?$/.test(s)?parseFloat(s):NaN;};   // null = trống, NaN = sai
  if(kind==="pain")hSheet(kind,ref,title,hDT(x,true)+hChips("part",Lx.part,Lx.bodyparts,x&&hTr("bodyparts",x.part),true)
      +hChips("level",Lx.level,["1","2","3","4","5"],x&&x.level,true)+`<div class="hhint">${S.levelHint}</div>`+hNoteF(x),T1,
    g=>g.need(["part","level"])||{type:"pain",part:g.pick("part"),level:g.pick("level")});
  else if(kind==="nose")hSheet(kind,ref,title,hDT(x,true)+hChips("amount",Lx.amount,Lx.amounts,x&&hTr("amounts",x.amount),true)
      +hChips("duration",Lx.duration,["<5′","5–15′",">15′"],x&&x.duration,false)+hChips("side",Lx.side,Lx.sides,x&&hTr("sides",x.side),false)+hNoteF(x),T1,
    g=>g.need(["amount"])||{type:"nose",amount:g.pick("amount"),duration:g.pick("duration")||undefined,side:g.pick("side")||undefined});
  else if(kind==="mood")hSheet(kind,ref,title,hDT(x,true)+hChips("mood",Lx.mood,Lx.moods,x&&hTr("moods",x.mood),true)+hNoteF(x),T1,
    g=>g.need(["mood"])||{type:"mood",mood:g.pick("mood")});
  else if(kind==="temp")hSheet(kind,ref,title,hDT(x,true)+`<div class="hdt">${numIn("hfV",S.tempVal+" *",x&&x.v,"37.5")}</div>`+hNoteF(x),
    {time:true,after:()=>{if(!x)$("hfV").focus();}},
    g=>{const v=num(g.val("hfV"));if(v==null||isNaN(v)){g.bad("hfV");return S.errTemp;}
      if((v<34||v>43)&&!confirm(S.tempOdd(hNum(v))))return false;
      return {v};});
  else if(kind==="sleep"){const ls=hAll().find(e=>e.kind==="sleep");const p=ls?ls.x:{};   // giờ mặc định = lần trước
    const bed=x?x.bed:(p.bed||"21:00"),wake=x?x.wake:(p.wake||"07:00");
    hSheet(kind,ref,title,hDT(x,false,S.wakeDay)
      +`<div class="hdt"><div><div class="lbl">${S.bed} *</div><input id="hfB" type="time" value="${esc(bed||"")}"></div><div><div class="lbl">${S.wake} *</div><input id="hfW" type="time" value="${esc(wake||"")}"></div></div>
       <div class="hhint" id="hfDur" style="margin:6px 0 10px"></div>`
      +hChips("quality",S.quality,S.qualities,x&&hTr("qualities",x.quality),false)+hNoteF(x),
      {time:false,after:()=>{const u=()=>{const h=durH($("hfB").value,$("hfW").value);$("hfDur").textContent=h?S.durLbl(hNum(h)):"";};
        $("hfB").oninput=u;$("hfW").oninput=u;u();}},
      g=>{const b=g.val("hfB"),w=g.val("hfW");if(!b){g.bad("hfB");return S.errSleep;}if(!w){g.bad("hfW");return S.errSleep;}
        return {bed:b,wake:w,quality:g.pick("quality")||undefined,time:w};});}
  else if(kind==="growth"){const lg=hAll().find(e=>e.kind==="growth");const p=lg?lg.x:{};   // số đo lần trước làm gợi ý
    hSheet(kind,ref,title,hDT(x,true)+`<div class="hdt">${numIn("hfH",S.height,x&&x.h,p.h?hNum(p.h):"125")}${numIn("hfKg",S.weight,x&&x.w,p.w?hNum(p.w):"24")}</div>`,
      {time:true,after:()=>{if(!x)$("hfH").focus();}},
      g=>{const h=num(g.val("hfH")),w=num(g.val("hfKg"));
        if(Number.isNaN(h)){g.bad("hfH");return S.errNum;}if(Number.isNaN(w)){g.bad("hfKg");return S.errNum;}
        if(h==null&&w==null){g.bad("hfH");return S.errGrowth;}
        if(((h!=null&&(h<30||h>220))||(w!=null&&(w<2||w>150)))&&!confirm(S.growthOdd))return false;
        return {h,w};});}}

/* ============ Báo cáo bác sĩ (DE) — từ dữ liệu thật ============ */
const dd=d=>d.split("-").reverse().join(".");
function isoWeek(ds){const d=new Date(ds+"T00:00:00");const t=new Date(d);t.setHours(0,0,0,0);
  t.setDate(t.getDate()+3-((d.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7);}
function acariMissed(){const items=anItems(),a=items.find(it=>/acarizax/i.test(it.t||""));if(!a)return [];
  const used={},taken={},today=iso(new Date());
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.indexOf("fam.anchk.")===0){const [date,id]=k.slice(10).split("|");used[date]=1;if(id===a.id)taken[date]=1;}}
  return Object.keys(used).filter(d=>d<today&&!taken[d]).sort();}
// Báo cáo luôn bằng tiếng Đức; chọn khoảng thời gian 30 / 90 ngày / tất cả (nhớ trong phiên).
let hRepDays=90;
function hRepData(days){const today=iso(new Date());let from="";
  if(days){const c=new Date();c.setDate(c.getDate()-(days-1));from=iso(c);}
  const arr=k=>{const a=ld(k);return Array.isArray(a)?a.filter(x=>x&&typeof x==="object"&&x.date&&x.date>=from):[];};
  const srt=a=>a.sort((p,q)=>hSort(p).localeCompare(hSort(q)));   // theo thời gian, cũ -> mới
  const H=arr("fam.health.logs");
  return {from,today,nose:srt(H.filter(x=>x.type==="nose")),pain:srt(H.filter(x=>x.type==="pain")),mood:srt(H.filter(x=>x.type==="mood")),
    temp:srt(arr("fam.temp")),sleep:srt(arr("fam.sleep")),grow:srt(arr("fam.growth")),missed:acariMissed().filter(d=>d>=from)};}
const hAcariEnd=s=>{const d=new Date();d.setDate(d.getDate()+acariDaysLeft(s));return iso(d);};
function hRepHtml(days,print){const R=hRepData(days),de=v=>esc(hNum(v,"de")),tr=(a,v)=>esc(hTr(a,v,"de"));
  const when=x=>dd(x.date)+(x.time?" "+esc(x.time):"");
  const tbl=(head,rows)=>rows.length?`<div class="tw"><table><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr>${rows.join("")}</table></div>`
    :`<p class="mut">keine Einträge im Zeitraum</p>`;
  const pl=(n,one,many)=>n+" "+(n===1?one:many);
  const tally=(a,f)=>{const m={};a.forEach(x=>{const k=f(x);if(k)m[k]=(m[k]||0)+1;});return Object.keys(m).sort((p,q)=>m[q]-m[p]).map(k=>`${esc(k)} ${m[k]}`).join(", ");};
  const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
  const tv=R.temp.map(x=>parseFloat(x.v)).filter(isFinite),fevDays=new Set(R.temp.filter(x=>+x.v>=38).map(x=>x.date)).size;
  const sh=R.sleep.map(x=>parseFloat(durH(x.bed,x.wake))).filter(isFinite),lv=R.pain.map(x=>parseFloat(x.level)).filter(isFinite);
  const lg=R.grow.length?R.grow[R.grow.length-1]:null,ac=acari(),hasAc=anItems().some(it=>/acarizax/i.test(it.t||""));
  // Nasenbluten pro Woche: tuần (thứ Hai) gần nhất, có cả tuần 0 lần
  const nW=days?Math.min(13,Math.ceil(days/7)):13,m0=mondayOf(new Date()),wk=[];
  for(let i=nW-1;i>=0;i--){const d=new Date(m0);d.setDate(m0.getDate()-i*7);const k=iso(d);wk.push({k,kw:isoWeek(k),n:0});}
  R.nose.forEach(x=>{const k=iso(mondayOf(new Date(x.date+"T00:00:00")));const w=wk.find(z=>z.k===k);if(w)w.n++;});
  const mx=Math.max(1,...wk.map(w=>w.n));
  const wkHtml=print?`<table><tr><th>KW</th>${wk.map(w=>`<th>${w.kw}</th>`).join("")}</tr><tr><td>Anzahl</td>${wk.map(w=>`<td>${w.n}</td>`).join("")}</tr></table>`
    :`<div class="bars">${wk.map(w=>`<div class="b" style="height:${Math.round(w.n/mx*70)+4}px">${w.n?`<i>${w.n}</i>`:""}<span>KW${w.kw}</span></div>`).join("")}</div>`;
  const ov=[
    ["Nasenbluten",pl(R.nose.length,"Eintrag","Einträge")+(R.nose.length?` · Menge: ${tally(R.nose,x=>hTr("amounts",x.amount,"de"))}`
      +(R.nose.some(x=>x.duration)?` · Dauer: ${tally(R.nose,x=>x.duration)}`:""):"")],
    ["Schmerzen",pl(R.pain.length,"Eintrag","Einträge")+(R.pain.length?` · ${tally(R.pain,x=>hTr("bodyparts",x.part,"de"))}`+(lv.length?` · Ø Stärke ${de(avg(lv).toFixed(1))}/5`:""):"")],
    ["Temperatur",pl(R.temp.length,"Messung","Messungen")+(tv.length?` · max ${de(Math.max(...tv))} °C · Tage mit ≥ 38 °C: ${fevDays}`:"")],
    ["Schlaf",pl(R.sleep.length,"Nacht","Nächte")+(sh.length?` · Ø ${de(avg(sh).toFixed(1))} Std`:"")],
    ["Stimmung",pl(R.mood.length,"Eintrag","Einträge")+(R.mood.length?` · ${tally(R.mood,x=>hTr("moods",x.mood,"de"))}`:"")],
    ["Wachstum",lg?`zuletzt ${lg.h?de(lg.h)+" cm":"–"} · ${lg.w?de(lg.w)+" kg":"–"} (${dd(lg.date)})`:"keine Messung im Zeitraum"],
    ["Acarizax",(hasAc?`vergessene Tage: ${R.missed.length}`:"Einnahme nicht in der Checkliste erfasst")+(ac?` · Vorrat reicht bis ca. ${dd(hAcariEnd(ac))}`:"")]];
  const H1=print?"h1":"h3",H2=print?"h3":"h4";
  return `<${H1}>Gesundheitsbericht · ${esc(CHILD())}</${H1}>
   <p class="mut">Erstellt am ${dd(iso(new Date()))} · Zeitraum: ${days?`${dd(R.from)} - ${dd(R.today)} (${days} Tage)`:"gesamter erfasster Verlauf"} · Angaben der Eltern</p>
   <${H2}>Übersicht</${H2}><div class="tw"><table>${ov.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</table></div>
   <${H2}>Nasenbluten pro Woche (letzte ${nW} Wochen)</${H2}>${wkHtml}
   <${H2}>Nasenbluten</${H2}>${tbl(["Datum / Uhrzeit","Menge","Dauer","Seite","Notiz"],R.nose.map(x=>`<tr><td>${when(x)}</td><td>${tr("amounts",x.amount)}</td><td>${esc(x.duration)}</td><td>${tr("sides",x.side)}</td><td>${esc(x.note)}</td></tr>`))}
   <${H2}>Schmerzen / Symptome</${H2}>${tbl(["Datum / Uhrzeit","Körperteil","Stärke","Notiz"],R.pain.map(x=>`<tr><td>${when(x)}</td><td>${tr("bodyparts",x.part)}</td><td>${esc(x.level)}/5</td><td>${esc(x.note)}</td></tr>`))}
   <${H2}>Temperatur</${H2}>${tbl(["Datum / Uhrzeit","°C","Hinweis","Notiz"],R.temp.map(x=>`<tr><td>${when(x)}</td><td${+x.v>=38?' class="fev"':""}>${de(x.v)}</td><td>${+x.v>=38?"≥ 38 °C":""}</td><td>${esc(x.note)}</td></tr>`))}
   <${H2}>Schlaf</${H2}>${tbl(["Aufwachtag","Zubett → Auf","Dauer","Qualität","Notiz"],R.sleep.map(x=>`<tr><td>${dd(x.date)}</td><td>${esc(x.bed||"–")} → ${esc(x.wake||"–")}</td><td>${durH(x.bed,x.wake)?de(durH(x.bed,x.wake))+" Std":""}</td><td>${tr("qualities",x.quality)}</td><td>${esc(x.note)}</td></tr>`))}
   <${H2}>Stimmung</${H2}>${tbl(["Datum / Uhrzeit","Stimmung","Notiz"],R.mood.map(x=>`<tr><td>${when(x)}</td><td>${tr("moods",x.mood)}</td><td>${esc(x.note)}</td></tr>`))}
   <${H2}>Wachstum</${H2}>${tbl(["Datum","Größe","Gewicht"],R.grow.map(x=>`<tr><td>${dd(x.date)}</td><td>${x.h?de(x.h)+" cm":""}</td><td>${x.w?de(x.w)+" kg":""}</td></tr>`))}
   <${H2}>Acarizax · vergessene Tage</${H2}><p>${!hasAc?"nicht erfasst":R.missed.length?`<span class="fev">${R.missed.map(dd).join(", ")}</span>`:"keine"}</p>`;}
function openReport(){const S=SL();
  open(`<div class="rep hrep"><div class="chips">${[[30,S.p30],[90,S.p90],[0,S.pAll]].map(p=>`<button type="button" class="chip${hRepDays===p[0]?" sel":""}" data-hrp="${p[0]}">${p[1]}</button>`).join("")}</div>

// In qua #printArea (@media print ẩn phần còn lại). Không dùng window.open: hàm open() của app che mất window.open

function cleanLegacyLog(s){
  const log=(s.keoLog||[]).slice(),del=new Set(),repl={};   // log: mới nhất ở đầu
  const after=(r,arr)=>{if(typeof r!=="string")return null;for(const p of arr)if(r.indexOf(p)===0)return r.slice(p.length);return null;};
  log.forEach((e,i)=>{if(!e||e.cur!=="sao"||del.has(i))return;
    if(LEG.checkUndo.includes(e.reason)){
      for(let j=i+1;j<log.length;j++){const o=log[j];
        if(!del.has(j)&&o&&o.date===e.date&&o.cur==="sao"&&LEG.checkPos.includes(o.reason)&&o.delta===-e.delta){del.add(i);del.add(j);break;}}}
    else if(after(e.reason,LEG.goalUndoPre)!==null){const txt=after(e.reason,LEG.goalUndoPre),wk=weekMonKey(e.date);
      for(let j=i+1;j<log.length;j++){const o=log[j];
        if(!del.has(j)&&o&&o.cur==="sao"&&o.delta===-e.delta&&weekMonKey(o.date)===wk&&after(o.reason,LEG.goalPre)===txt){del.add(i);del.add(j);break;}}}});
  // Đánh giá: mỗi ngày gộp còn 1 dòng = đánh giá cuối cùng (tổng delta giữ nguyên)
  const groups={};
  log.forEach((e,i)=>{if(!e||del.has(i)||e.cur!=="sao"||e.k)return;
    if(after(e.reason,LEG.evalPre)!==null||after(e.reason,LEG.evalUndoPre)!==null)(groups[e.date]=groups[e.date]||[]).push(i);});
  Object.keys(groups).forEach(d=>{const idx=groups[d];
    const sum=idx.reduce((t,i)=>t+(Number(log[i].delta)||0),0);
    const fin=(s.evalHist||{})[d]||(s.eval&&s.eval.date===d?s.eval.key:null);
    const r=fin&&L().evalRatings.find(x=>x[0]===fin);
    if(r){repl[idx[0]]={date:d,delta:sum,reason:L().rsEval(r[1]),k:"eval",key:fin,cur:"sao"};idx.slice(1).forEach(i=>del.add(i));}
    else if(sum===0)idx.forEach(i=>del.add(i));});
  return log.map((e,i)=>repl[i]||e).filter((e,i)=>!del.has(i));}

    temp.setHours(0, 0, 0, 0);
    const end = new Date(today);

/* --- Tính lãi tiền gửi (2%/năm) --- */
function checkPocketMoneyInterest() {
  const s = kidState();
  const today = new Date();
  if (!s.interestLastDate) {
    s.interestLastDate = iso(today);
    s.pocketMoneyAccruedInterest = s.pocketMoneyAccruedInterest || 0;
    kidSave(s);
    return;
  }
  const lastDate = new Date(s.interestLastDate + "T00:00:00");
  const temp = new Date(lastDate);
  temp.setDate(temp.getDate() + 1);
  temp.setHours(0, 0, 0, 0);
  const end = new Date(today);
  end.setHours(0, 0, 0, 0);

  let currentBalance = s.pocketMoney || 0;
  let accrued = s.pocketMoneyAccruedInterest || 0;
  let changed = false;
  let lastCalc = new Date(lastDate);

  while (temp <= end) {
    const dailyInterest = currentBalance > 0 ? (currentBalance * 0.02 / 365) : 0;
    accrued += dailyInterest;

    if (temp.getMonth() !== lastCalc.getMonth()) {
      if (accrued > 0) {
        currentBalance += accrued;
        s.keoLog.unshift({
          date: iso(temp),
          delta: Number(accrued.toFixed(4)),
          reason: LANG === "vi" ? `Nhập gốc lãi tiết kiệm tháng ${lastCalc.getMonth() + 1}/${lastCalc.getFullYear()} (2%/năm)` : `Zinsgutschrift für ${lastCalc.getMonth() + 1}/${lastCalc.getFullYear()} (2%/Jahr)`,
          cur: "euro"
        });
        accrued = 0;
      }
    }

    lastCalc.setTime(temp.getTime());
    temp.setDate(temp.getDate() + 1);
    changed = true;
  }

  if (changed) {
    s.pocketMoney = Number(currentBalance.toFixed(4));
    s.pocketMoneyAccruedInterest = Number(accrued.toFixed(4));
    s.interestLastDate = iso(today);
    kidSave(s);
  }
}

const isMetaKey=k=>k.indexOf("fam.snap")===0||k.indexOf("fam.exports")===0||k.indexOf("fam.undo")===0;
function famDump(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
  if(k&&k.indexOf("fam.")===0&&!isMetaKey(k))o[k]=localStorage.getItem(k);}return o;}

function pushExport(dumpObj){const a=ld("fam.exports"),now=new Date();
  const p=n=>String(n).padStart(2,"0");
  a.push({ts:Date.now(),label:p(now.getDate())+"/"+p(now.getMonth()+1)+" "+p(now.getHours())+":"+p(now.getMinutes()),data:dumpObj});
  while(a.length>12)a.shift();sv("fam.exports",a);}
// Nhập thông minh: key "fam.*" giữ nguyên; key "lich.*" đổi tiền tố sang "fam.*" (bỏ lich.pinok).
function famRestore(o){let n=0;Object.keys(o).forEach(k=>{
  if(k.indexOf("fam.")===0){localStorage.setItem(k,o[k]);n++;}
  else if(k.indexOf("lich.")===0){if(k==="lich.pinok")return;localStorage.setItem("fam."+k.slice(5),o[k]);n++;}});
  return n;}
// Gộp: mảng có id -> union theo id (trùng id giữ bản local); key khác -> chỉ ghi nếu local chưa có.
const MERGE_LIST_KEYS=["fam.an.items","fam.chores","fam.dl.items","fam.health.logs","fam.sleep","fam.temp","fam.growth","fam.kid.diary"];
function famMerge(o){let n=0;
  const norm={};Object.keys(o).forEach(k=>{
    if(k.indexOf("fam.")===0)norm[k]=o[k];
    else if(k.indexOf("lich.")===0&&k!=="lich.pinok")norm["fam."+k.slice(5)]=o[k];});
  Object.keys(norm).forEach(k=>{
    if(isMetaKey(k))return;
    if(MERGE_LIST_KEYS.includes(k)){
      let inc;try{inc=JSON.parse(norm[k]);}catch(e){return;}
      if(!Array.isArray(inc))return;
      const cur=ld(k);
      const seen=new Set(cur.map(x=>x&&x.id?String(x.id):JSON.stringify(x)));
      let added=0;
      inc.forEach(x=>{if(!x)return;const key=x.id?String(x.id):JSON.stringify(x);
        if(!seen.has(key)){cur.push(x);seen.add(key);added++;}});
      if(added){sv(k,cur);n+=added;}
    }else if(localStorage.getItem(k)===null){
      try{localStorage.setItem(k,norm[k]);n++;}catch(e){storageFull(e);}
    }});
  return n;}

function acari(){const v=localStorage.getItem("fam.acari");if(v){try{return JSON.parse(v)}catch(e){}}return null;}
function acariRemain(s){if(!s)return 0;const days=Math.max(0,Math.round((new Date(iso(new Date())+"T00:00:00")-new Date(s.since+"T00:00:00"))/864e5));return Math.max(0,s.count-(s.perDay||2)*days);}
const acariDaysLeft=s=>s?Math.floor(acariRemain(s)/(s.perDay||2)):0;
function renderAcari(){const s=acari();$("h_acari").textContent=L().acariH;$("acariUnit").textContent=L().acariUnit;
  $("acariBuy").textContent=s?L().acariBuy:L().acariSet;
  $("acariDays").textContent=s?acariDaysLeft(s):"–";
  $("acariBreak").textContent=s?L().acariBreak(acariRemain(s),s.perDay||2)+" · "+SL().acariEnd(dd(hAcariEnd(s)).slice(0,6)):L().acariSetup;}
function renderAcariReminder(){const el=$("acariReminder"),s=acari();
  if(s&&acariDaysLeft(s)<=14){el.hidden=false;el.textContent=L().acariRemind(acariDaysLeft(s))+" ("+SL().acariEnd(dd(hAcariEnd(s)).slice(0,6))+")";}else el.hidden=true;}
function acariBuyFn(){const s0=acari();
  openForm({title:s0?L().acariBuy.replace(/^💊 /,""):L().acariSet.replace(/^💊 /,""),fields:[
    {key:"boxes",label:L().acariAsk.replace(/[?？]$/,""),type:"number",min:0,step:0.5,value:4,required:true},
    {key:"ppb",label:L().acariPpb.replace(/[?？]$/,""),type:"number",min:1,value:30},
    {key:"perDay",label:L().acariPerDay,type:"number",min:1,value:s0?(s0.perDay||2):2}],
   onSave:v=>{
     const boxes=v.boxes||0;if(!boxes)return;
     const ppb=v.ppb&&v.ppb>0?v.ppb:30;
     const perDay=v.perDay&&v.perDay>0?v.perDay:(s0?(s0.perDay||2):2);
     const s={count:Math.round(boxes*ppb)+acariRemain(s0),perDay,since:iso(new Date())};
     try{localStorage.setItem("fam.acari",JSON.stringify(s));}catch(e){storageFull(e);}
     renderAll();}});}

  const ev=todayEval(s);
  $("evalBtns").innerHTML=L().evalRatings.map(r=>`<button class="gbtn g_${r[0]}${ev&&ev.key===r[0]?' sel':''}" data-eval="${r[0]}">${r[1]}<br>${r[2]}</button>`).join("");
  $("evalStatus").textContent=L().evalStatus(ev?L().evalRatings.find(r=>r[0]===ev.key)[1]:null);
  $("rwList").innerHTML=s.tiers.slice().sort((a,b)=>a.t-b.t).map(b=>{const got=s.saoLife>=b.t;
    return `<div class="row" style="${got?'':'opacity:.55'}">${got?esc(b.e||""):'🔒'} <b>${esc(T_val(b.name))}</b> · ${b.t}⭐ · +${b.bonus}🍬${b.reward?' · 🎁 '+esc(b.reward):''}</div>`;}).join("")||`<div class="row" style="color:var(--mut)">${L().mgEmpty}</div>`;
  $("rwHint").textContent=L().rwHint;
  $("pKeo").textContent=s.keo||0;$("pKeo").className="bignum gold"+negK;
  $("keoUnit").textContent=L().keoUnit;
  $("gTest").textContent=L().gTest;$("gKonig").textContent=L().gKonig;$("gPay").textContent=L().gPay;
  $("gPlus").textContent=L().gPlus;$("gMinus").textContent=L().gMinus;
  document.querySelectorAll("[data-eval]").forEach(b=>b.onclick=()=>applyEval(b.dataset.eval));
  $("critBtn").onclick=openCrit;
  $("sPlus").onclick=()=>saoManual(1);
  $("sMinus").onclick=()=>saoManual(-1);
  $("saoAdjustsContainer").querySelectorAll("[data-sao-adj-id]").forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.saoAdjId;
      const adj = saoAdjusts().find(x => String(x.id) === String(id));
      if (!adj) return;
      const displayName = LANG === "vi" ? adj.text : (adj.textDe || adj.text);
      const signWord = adj.delta > 0 ? (LANG === "vi" ? "cộng" : "hinzufügen") : (LANG === "vi" ? "trừ" : "abziehen");
      const absDelta = Math.abs(adj.delta);
      const confirmMsg = LANG === "vi" 
        ? `Xác nhận ${signWord} ${absDelta} sao vì con ${displayName}?`
        : `Bestätigen: ${absDelta} Sterne ${signWord} wegen "${displayName}"?`;
      if (!confirm(confirmMsg)) return;

      const s = kidState();
      undoPush(`${adj.delta>0?"+":""}${adj.delta}⭐ ${displayName}`);
      s.sao = (s.sao || 0) + adj.delta;
      if (adj.delta > 0) s.saoLife = (s.saoLife || 0) + adj.delta;
      logAdd(s,{delta:adj.delta,reason:displayName,cur:"sao"});
      if (adj.delta > 0) checkBadges(s);
      kidSave(s);
      playSound('click');
      renderRewardAll();
    };
  });
  $("mPlus").onclick=()=>moneyManual(1);
  $("mMinus").onclick=()=>moneyManual(-1);
  $("mPfand").onclick=pfandAction;}

function renderManageBody(){
  const s=kidState();
  const row=(nm,tok)=>`<div class="chk" style="cursor:default"><span class="nm">${nm}</span>
    <span class="ic" data-mgedit="${esc(tok)}">✏️</span><span class="ic" data-mgdel="${esc(tok)}">✕</span></div>`;
  const em=e=>e?esc(e)+" ":"";
  const sec=(title,rowsHtml,addKind,addLabel)=>`<div class="lbl" style="margin-top:14px">${title}</div>
    ${rowsHtml||`<div class="empty">${L().mgEmpty}</div>`}
    <button class="add" data-mgadd="${addKind}">${addLabel}</button>`;
  $("mgBody").innerHTML=
     sec(L().mgSecCheck, anItems().map(c=>row(esc(T_val(c.t)),"check:"+c.id)).join(""), "check", L().mgAddCheck)
    +sec(L().mgSecSaoAdjust, saoAdjusts().map(adj => row(`${em(adj.emoji)}${esc(adj.text)} / ${esc(adj.textDe || adj.text)} · <b style="color:${adj.delta < 0 ? 'var(--r)' : 'var(--g)'}">${adj.delta > 0 ? '+' : ''}${adj.delta}⭐</b>`, "saoadj:" + adj.id)).join(""), "saoadj", L().mgAddSaoAdjust)
    +sec(L().mgSecGoal, s.goals.map(g=>row(`${em(g.emoji)}${esc(T_val(g.text))}`,"goal:"+g.id)).join(""), "goal", L().mgAddGoal)
    +sec(L().mgSecShop, s.shop.map(it=>row(`${em(it.e)}${esc(T_val(it.name))} · <b style="color:${it.cur==='sao'?'var(--y)':'#c99bff'}">${costLabel(it)}</b>${it.min?` · ${it.min}′`:""}`,"shop:"+it.id)).join(""), "shop", L().mgAddShop)
    +sec(L().mgSecTier, s.tiers.slice().sort((a,b)=>a.t-b.t).map(b=>row(`${em(b.e)}${esc(T_val(b.name))} · ${b.t}⭐ · +${b.bonus}🍬${b.reward?' · 🎁 '+esc(b.reward):''}`,"tier:"+b.id)).join(""), "tier", L().mgAddTier);
  // [data-mgadd/mgedit/mgdel] handled by global delegate at document level
}

let manualNight=false,wakeUntil=0;
function nightCfg(){try{const c=JSON.parse(localStorage.getItem("fam.night"));if(c){const res=Object.assign({on:true,from:"23:00",to:"06:00"},c);if(res.from==="21:30")res.from="23:00";if(res.to==="06:30")res.to="06:00";return res;}}catch(e){}return {on:true,from:"23:00",to:"06:00"};}
function nightSave(c){localStorage.setItem("fam.night",JSON.stringify(c));}
function inWin(now,from,to){const m=now.getHours()*60+now.getMinutes(),f=from.split(":").map(Number),t=to.split(":").map(Number),a=f[0]*60+f[1],b=t[0]*60+t[1];return a<=b?(m>=a&&m<b):(m>=a||m<b);}
function showNight(){const now=new Date();
  $("nightClock").textContent=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  $("nightDate").textContent=L().dayShort[now.getDay()]+" · "+iso(now).split("-").reverse().join("/");
  $("nightHint").textContent=KL().nightHint;$("night").hidden=false;}
function tickNight(){
  if(TAB==="kid"||!$("ov").hidden){$("night").hidden=true;return;}   // đang dùng (tab con / popup) -> không tối
  const c=nightCfg(),now=new Date();
  if(manualNight||(c.on&&inWin(now,c.from,c.to)&&Date.now()>=wakeUntil))showNight();else $("night").hidden=true;}

function autoRefreshTick(){
  checkDateChange();
  const now=new Date();
  const today=iso(now);
  if(now.getHours()===6&&$("night").hidden&&document.visibilityState==="visible"&&localStorage.getItem("fam.last_reload_6")!==today){
    localStorage.setItem("fam.last_reload_6", today);
    location.reload();
  }
}

/* ============ PWA: đăng ký service worker (offline) ============ */
function showUpdateBanner() {
  const el = $("swUpdateReminder");
  if (el) {
    el.textContent = L().swUpdate;
    el.hidden = false;
  }
}
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound", () => {
        const newWorker = reg.installing;
        newWorker.addEventListener("statechange", () => {
          if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
            showUpdateBanner();
          }
        });
      });
      if (reg.waiting) {
        showUpdateBanner();
      }
    }).catch(()=>{});
  });
}
