<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Gia đình</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0f1115;--card:#1a1d24;--fg:#e9edf3;--mut:#9aa0aa;--bd:#2a2f3a;
  --r:#ff5a5a;--o:#ffa53a;--y:#ffd84d;--g:#5fd08a;--blue:#3f6fd0;--pink:#c0407f;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;
  padding:14px;max-width:1040px;margin:0 auto;user-select:none}
h2{font-size:13px;letter-spacing:.08em;color:var(--mut);margin:16px 4px 8px;text-transform:uppercase}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 4px 10px;
  padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
.bar .d{font-size:22px;font-weight:800}.bar .t{font-size:13px;color:var(--mut)}
.lang button{background:#222733;border:1px solid var(--bd);color:var(--mut);padding:6px 10px;border-radius:8px;font-size:13px;cursor:pointer}
.lang button.on{background:var(--g);color:#06210f;border-color:var(--g);font-weight:700}
.mockbanner{background:#2a2410;border:1px solid #6a5520;color:#ffd98a;border-radius:10px;padding:8px 12px;font-size:13px;margin:0 4px 10px}
.tabs{display:flex;gap:6px;margin:0 4px 12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:10}
.tabs button{flex:1;background:var(--card);border:1px solid var(--bd);color:var(--mut);padding:11px 4px;border-radius:11px;font-size:13px;font-weight:700;cursor:pointer;line-height:1.2}
.tabs button.on{background:#1d2740;border-color:var(--blue);color:var(--fg)}
.page{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:820px){.page{grid-template-columns:1fr 1fr;gap:22px;align-items:start}}
.today{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cell{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 8px;text-align:center;cursor:pointer;position:relative}
.cell .ca{font-size:12px;color:var(--mut);letter-spacing:.06em}
.cell .who{font-size:24px;font-weight:800;margin-top:4px}
.bo{background:linear-gradient(155deg,#2a5fd0,#16233a);border-color:var(--blue)}
.me{background:linear-gradient(155deg,#c0407f,#2a1622);border-color:var(--pink)}
.lk{position:absolute;top:5px;right:7px;font-size:12px}
.cell.locked{outline:2px solid #ffd84d88}
@keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.nope{animation:nope .28s}
table{width:100%;border-collapse:separate;border-spacing:5px;margin-top:4px}
th{font-size:11px;color:var(--mut);font-weight:600}th.now{color:var(--fg)}th .dn{display:block;font-size:10px;color:var(--mut)}
td{text-align:center;border-radius:9px;padding:11px 2px;font-size:20px;cursor:pointer;border:1px solid var(--bd);background:var(--card);position:relative}
td.now{outline:2px solid #7da7ff77}.lab{font-size:11px;color:var(--mut);text-align:right;padding-right:4px}
.tdlk{position:absolute;top:0;right:2px;font-size:9px}
.tally{font-size:13px;color:var(--mut);margin:8px 4px}.tally b{color:var(--fg)}
.legend{font-size:12px;color:var(--mut);margin:4px 4px}
.wknav{display:flex;gap:8px;align-items:center;margin:2px 4px 6px}
.wknav button{background:#222733;border:1px solid var(--bd);color:var(--fg);border-radius:9px;padding:9px 12px;font-size:14px;font-weight:700;cursor:pointer}
.wknav #wkLabel{flex:1;color:var(--mut)}
.chk{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;margin:7px 0;cursor:pointer}
.chk .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--mut);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px}
.chk.done .box{background:var(--g);border-color:var(--g);color:#06210f}
.chk .nm{flex:1;font-size:16px}.chk.done .nm{text-decoration:line-through;color:var(--mut)}
.chk .ic{min-width:38px;text-align:center;color:var(--mut);font-size:15px}
.add{width:100%;margin:8px 0 2px;background:#16241a;border:1px dashed #3a5a40;color:#9fe0b0;padding:12px;border-radius:12px;font-size:14px;cursor:pointer}
.empty{color:var(--mut);font-size:14px;margin:8px 4px;text-align:center}
/* việc định kỳ */
.chore{display:flex;align-items:center;gap:10px;background:linear-gradient(155deg,#2a2410,#1a1d24);border:1px solid #6a5520;border-radius:12px;padding:12px;margin:7px 0;cursor:pointer}
.chore .box{width:26px;height:26px;border-radius:50%;border:2px solid var(--o);flex:none;display:flex;align-items:center;justify-content:center;color:var(--o);font-size:18px}
.chore .nm{flex:1;font-size:15px;font-weight:600}.chore .sub{font-size:12px;color:var(--mut);margin-top:2px;font-weight:400}
.chore.t2{background:linear-gradient(155deg,#23262e,#191b20);border-color:#3a3f4a}
.chore.t2 .box{border-color:var(--mut);color:var(--mut)}.chore.t2 .nm{font-weight:500;font-size:14px}
.t2lbl{font-size:11px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;margin:12px 4px 2px}
.ic{display:inline-flex;align-items:center;justify-content:center;min-width:40px;min-height:40px;color:var(--mut);font-size:16px;cursor:pointer;flex:none}
/* lịch bác sĩ */
.dl{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-left-width:5px;border-radius:12px;padding:10px 12px;margin:8px 0}
.dl .ttl{flex:1;font-size:15px}.dl .when{font-size:13px;color:#c7ccd6;margin-top:2px}.dl .cd{font-size:14px;font-weight:800;white-space:nowrap}
.dl.pbo{border-left-color:var(--blue)}.dl.pme{border-left-color:var(--pink)}.dl.pan{border-left-color:var(--g)}.dl.pall{border-left-color:var(--y)}
.dl.late{box-shadow:inset 0 0 0 1px var(--r)}
.dl .box{width:28px;height:28px;border-radius:50%;border:2px solid #ffffffaa;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;cursor:pointer}
.dl .ic2{display:inline-flex;align-items:center;justify-content:center;min-width:40px;cursor:pointer;font-size:20px}
.addform{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.addform input,.addform select{background:#0c0e12;border:1px solid var(--bd);color:var(--fg);padding:11px;border-radius:9px;font-size:15px;width:100%}
.addform .frow{display:flex;gap:8px}.addform .frow>*{flex:1}
.addform .fsave{background:var(--g);color:#06210f;border:0;font-weight:700;padding:11px;border-radius:9px;font-size:14px;cursor:pointer}
.addform .fghost{background:#222733;color:var(--mut);border:0;font-weight:700;padding:11px;border-radius:9px;font-size:14px;cursor:pointer}
.hbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.hbtn{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px 6px;text-align:center;cursor:pointer;font-weight:700}
.hbtn .e{font-size:30px;display:block;margin-bottom:4px}
.hbtn.pain{border-color:#c0407f55}.hbtn.nose{border-color:#ff5a5a55}.hbtn.mood{border-color:#5fd08a55}
.hist{font-size:13px;color:#c7ccd6;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;margin-top:6px}
.hist .row{padding:6px 0;border-top:1px solid var(--bd)}.hist .row:first-child{border-top:0}
.report{width:100%;background:#16241a;border:1px solid #3a5a40;color:#bfe9cc;padding:13px;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.gamebox{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.bignum{font-size:54px;font-weight:800;text-align:center;line-height:1}.bignum.gold{color:var(--y)}
.gunit{text-align:center;color:var(--mut);font-size:14px;margin-bottom:6px}
.gbreak{text-align:center;color:var(--mut);font-size:12px;margin-bottom:8px}
.done{text-align:center;color:var(--g);font-weight:700;margin-bottom:6px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.gbtn{border:0;border-radius:9px;padding:10px 2px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;line-height:1.25}
.g_cn{background:#16a34a}.g_n{background:#65a30d}.g_bt{background:#64748b}.g_h{background:#ea580c}.g_ch{background:#dc2626}
.gbtn.sel{outline:3px solid #fff;outline-offset:1px}
.gstatus{font-size:12px;color:var(--mut);text-align:center;margin-top:8px}
.critbtn{width:100%;margin-top:10px;background:#222733;border:1px solid var(--bd);color:var(--mut);padding:10px;border-radius:9px;font-size:13px;cursor:pointer}
.gumbtn{width:100%;margin-top:8px;border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer}
.gumbtn.indigo{background:#4f46e5;color:#fff}.gumbtn.gold2{background:#d97706;color:#fff}.gumbtn.ghost{background:#222733;color:var(--mut)}
#ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:50}
@media(min-width:600px){#ov{align-items:center}}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:18px 18px 0 0;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:18px}
@media(min-width:600px){.sheet{border-radius:18px}}
.sheet h3{margin:0 0 12px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.chip{background:#0c0e12;border:1px solid var(--bd);color:var(--fg);padding:9px 13px;border-radius:20px;font-size:14px;cursor:pointer}
.chip.sel{background:var(--g);color:#06210f;border-color:var(--g);font-weight:700}
.lbl{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:4px 0 2px}
.sheet textarea{width:100%;background:#0c0e12;border:1px solid var(--bd);color:var(--fg);border-radius:9px;padding:10px;font:14px/1.4 system-ui;margin-top:6px}
.sheet input{width:100%;background:#0c0e12;border:1px solid var(--bd);color:var(--fg);border-radius:9px;padding:11px;font-size:16px;margin-top:4px}
.sheet .acts{display:flex;gap:8px;margin-top:14px}
.sheet .acts button{flex:1;padding:13px;border-radius:10px;border:0;font-weight:700;font-size:15px;cursor:pointer}
.save{background:var(--g);color:#06210f}.cancel{background:#222733;color:var(--mut)}
.notebtn{background:#0c0e12;border:1px dashed var(--bd);color:var(--mut);padding:9px;border-radius:9px;width:100%;cursor:pointer;font-size:13px;margin-top:4px}
.rep th,.rep td{border:1px solid var(--bd);padding:6px 8px;text-align:left;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin:10px 0 22px;border-bottom:1px solid var(--bd);padding-bottom:2px}
.bars .b{flex:1;background:var(--blue);border-radius:4px 4px 0 0;min-height:3px;position:relative}
.bars .b span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut)}
.foot{margin:22px 4px;color:var(--mut);font-size:12px;text-align:center}
.neg{color:var(--r)!important}
.wallets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.wallet{border-radius:18px;padding:14px;text-align:center}
.wallet.sao{background:linear-gradient(155deg,#2a2410,#1a1d24);border:1px solid #6a5520}
.wallet.keo{background:linear-gradient(155deg,#241033,#161022);border:1px solid #5a3a7a}
.wallet .n{font-size:32px;font-weight:800;line-height:1.1}
.wallet.sao .n{color:var(--y)}.wallet.keo .n{color:#c99bff}
.wallet .sub{font-size:13px;margin-top:2px;color:#cfd3db}
.hand{background:linear-gradient(155deg,#1b2740,#12182a);border:2px solid var(--blue);border-radius:18px;padding:14px;text-align:center;margin:10px 0}
.hand .big{font-size:28px;font-weight:800}
.hand .q{font-size:15px;font-weight:700;margin-bottom:8px}
.hand .cnt{font-size:14px;color:#cfe0ff;margin-bottom:10px}
.handbtn{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-size:16px;font-weight:800;cursor:pointer;width:100%}
.shopbuy{opacity:.55}
/* ===== View của Con (Kid mode) ===== */
#kidPanel{background:linear-gradient(165deg,#1a1530,#12131f 55%,#10211a);border:1px solid var(--bd);border-radius:18px;padding:16px}
.kidtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.kidav{font-size:34px;cursor:pointer;line-height:1;width:60px;height:60px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--kidc,#5fd08a)}
.kidhi{flex:1;font-size:22px;font-weight:800}
.kidclose{background:#222733;border:1px solid var(--bd);color:var(--fg);border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700;cursor:pointer}
.kidstar{background:linear-gradient(155deg,#2a2410,#1a1d24);border:1px solid #6a5520;border-radius:18px;padding:14px;text-align:center;margin-bottom:8px}
.kidstar .n{font-size:34px;font-weight:800;color:var(--y);line-height:1.1}
.kidstar .sub{font-size:14px;color:#ffd98a;margin-top:2px}
.kidcheer{background:#16241a;border:1px solid #3a5a40;color:#bfe9cc;border-radius:14px;padding:12px;text-align:center;font-weight:800;margin-bottom:10px;animation:pop .4s}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
.kidask{background:linear-gradient(155deg,#16241a,#0f1d14);border:2px solid var(--g);border-radius:18px;padding:16px;margin-bottom:12px;text-align:center;animation:pop .4s}
.kidask .q{font-size:18px;font-weight:800;margin-bottom:12px;line-height:1.3}
.kidask .askyes{flex:2;background:var(--g);color:#06210f;border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:800;cursor:pointer}
.kidask .askno{flex:1;background:#222733;color:var(--mut);border:0;border-radius:14px;padding:16px;font-size:13px;font-weight:700;cursor:pointer}
.kidbadges{display:flex;gap:8px;overflow-x:auto;margin-bottom:6px;padding-bottom:2px}
.kidbadge{flex:0 0 auto;background:#1b1f27;border:1px solid var(--bd);border-radius:14px;padding:8px 10px;text-align:center;font-size:24px;min-width:66px;opacity:.45}
.kidbadge span{display:block;font-size:11px;color:var(--mut);margin-top:2px;font-weight:700}
.kidbadge.got{opacity:1;background:linear-gradient(155deg,#2a2410,#1a1d24);border-color:#6a5520}
.kidbadge.got span{color:#ffd98a}
.kcolor{width:30px;height:30px;border-radius:50%;cursor:pointer;display:inline-block}
.kcolor.sel{outline:3px solid #fff;outline-offset:2px}
.kidsec{margin:16px 2px 8px;font-size:14px;color:var(--mut);font-weight:700}
.kidmood{display:flex;gap:8px}
.kidmood button{flex:1;font-size:30px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 0;cursor:pointer}
.kidmood button.sel{outline:3px solid var(--g);outline-offset:1px}
.kidrow{display:flex;gap:8px;margin-top:6px}
.kidrow input{flex:1;background:#0c0e12;border:1px solid var(--bd);color:var(--fg);border-radius:12px;padding:12px;font-size:15px}
.kidrow button{background:var(--g);color:#06210f;border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}
.kidavpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.kidavpick span{font-size:30px;cursor:pointer;padding:4px;border-radius:10px}
.kidavpick span.sel{background:#2a3550;outline:2px solid var(--blue)}
.kiddiary{font-size:13px;color:#c7ccd6;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 12px;margin-top:6px}
.kiddiary .row{padding:6px 0;border-top:1px solid var(--bd)}.kiddiary .row:first-child{border-top:0}
/* ===== Tối giản ban đêm ===== */
#night{position:fixed;inset:0;z-index:80;background:#000;color:#3a3f4a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;cursor:pointer;user-select:none}
#night .clock{font-size:84px;font-weight:800;letter-spacing:3px;line-height:1}
#night .nd{font-size:18px;color:#2c303a}
#night .nh{position:absolute;bottom:26px;font-size:12px;color:#23262e}
#nightBtn{background:#222733;border:1px solid var(--bd);color:var(--mut);padding:6px 10px;border-radius:8px;font-size:15px;cursor:pointer}
#printArea{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;max-width:none}
  body>*{display:none!important}
  #printArea{display:block!important;color:#000;font:13px/1.4 system-ui}
  #printArea h1{font-size:20px;margin:0 0 2px}
  #printArea h3{font-size:14px;margin:14px 0 4px}
  #printArea table{width:100%;border-collapse:collapse;margin:4px 0 12px}
  #printArea th,#printArea td{border:1px solid #999;padding:5px 8px;text-align:left;font-size:12px;color:#000}
  @page{size:A4;margin:16mm}
}
</style>
</head>
<body>

<div class="bar">
  <div><div class="d" id="dateLbl"></div><div class="t" id="weekLbl"></div></div>
  <div class="lang"><button id="nightBtn" title="Ban đêm">🌙</button><button data-lang="vi" class="on">VI</button><button data-lang="de">DE</button><button id="cog">⚙️</button></div>
</div>
<div class="mockbanner" id="backupReminder" hidden style="cursor:pointer;background:#1a2a16;border-color:#3a5a40;color:#9fe0b0"></div>
<div class="mockbanner" id="acariReminder" hidden style="cursor:pointer"></div>
<div class="mockbanner" id="swUpdateReminder" hidden style="cursor:pointer;background:#1d3557;border-color:#457b9d;color:#f1faee;text-align:center" onclick="location.reload()"></div>

<div class="tabs">
  <button data-tab="truc" id="tab_truc"></button>
  <button data-tab="con" id="tab_con"></button>
  <button data-tab="kid" id="tab_kid"></button>
  <button data-tab="health" id="tab_health"></button>
  <button data-tab="lich" id="tab_lich"></button>
</div>

<!-- ===== TAB: TRỰC + việc hằng ngày ===== -->
<div class="panel" data-panel="truc">
 <div class="page">
  <div class="col">
   <h2 id="h_today"></h2><div class="today" id="todayCard"></div>
   <h2 id="h_week"></h2>
   <div class="wknav"><button data-wkrel="-1">◀</button><button id="wkLabel"></button><button data-wkrel="1">▶</button></div>
   <table id="weekGrid"></table>
   <div class="tally" id="tally"></div><div class="legend" id="legend"></div>
  </div>
  <div class="col">
   <h2 id="h_daily"></h2><div id="dailyList"></div><div id="dutyAsk"></div>
  </div>
 </div>
</div>

<!-- ===== TAB: ĐỊNH KỲ & KHÁM ===== -->
<div class="panel" data-panel="lich" hidden>
 <div class="page">
  <div class="col">
   <h2 id="h_chores"></h2><div id="choreList"></div>
  </div>
  <div class="col">
   <h2 id="h_appt"></h2><div id="apptList"></div>
  </div>
 </div>
</div>

<!-- ===== TAB: THƯỞNG PHẠT ===== -->
<div class="panel" data-panel="con" hidden>
 <div class="page">
  <div class="col">
   <h2 id="h_sao"></h2>
    <div class="gamebox">
      <div class="bignum gold" id="pSao">–</div><div class="gunit" id="pSaoUnit"></div>
      <div class="gstatus" id="evalStatus" style="margin-bottom:8px"></div>
      <div class="grid5" id="evalBtns"></div>
      <button class="critbtn" id="critBtn"></button>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="gumbtn ghost" id="sPlus" style="margin:0;flex:1"></button>
        <button class="gumbtn ghost" id="sMinus" style="margin:0;flex:1"></button>
      </div>
      <div id="saoAdjustsContainer" style="display:flex;flex-direction:column;gap:8px;margin-top:8px;width:100%"></div>
    </div>
   <h2 id="h_badges"></h2>
   <div class="hist" id="rwList"></div>
   <div class="empty" id="rwHint" style="text-align:left;font-size:12.5px"></div>
  </div>
  <div class="col">
   <h2 id="h_keo"></h2>

function getStorageUsage() {
  let total = 0;
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k) total += k.length + (localStorage.getItem(k) || "").length;
  }
  const kb = total / 1024;
  const pct = (kb / 5000) * 100;
  return { kb: Math.round(kb), pct: Math.round(pct) };
}

function triggerConfetti() {
  const canvas = document.createElement('canvas');
  canvas.style.position = 'fixed';
  canvas.style.inset = '0';
  canvas.style.width = '100vw';
  canvas.style.height = '100vh';
  canvas.style.pointerEvents = 'none';
  canvas.style.zIndex = '9999';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;
  
  const particles = [];
  const colors = ['#ffd84d', '#5fd08a', '#3f6fd0', '#c0407f', '#ffa53a', '#ff5a5a'];
  for (let i = 0; i < 100; i++) {
    particles.push({
      x: Math.random() * width,
      y: Math.random() * height - height,
      r: Math.random() * 4 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      tilt: Math.random() * 10 - 5,
      tiltAngleIncremental: Math.random() * 0.07 + 0.02,
      tiltAngle: 0,
      vy: Math.random() * 4 + 3,
      vx: Math.random() * 2 - 1
    });
  }

  let animationFrameId;
  function draw() {
    ctx.clearRect(0, 0, width, height);
    let active = false;
    particles.forEach(p => {
      p.tiltAngle += p.tiltAngleIncremental;
      p.y += p.vy;
      p.x += p.vx + Math.sin(p.tiltAngle) * 0.5;
      
      if (p.y < height) {
        active = true;
        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
        ctx.stroke();
      }
    });

    if (active) {
      animationFrameId = requestAnimationFrame(draw);
    } else {
      cancelAnimationFrame(animationFrameId);
      canvas.remove();
    }
  }
  draw();
}

function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (type === 'success') {
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, ctx.currentTime + i * 0.1);
        gain.gain.setValueAtTime(0.12, ctx.currentTime + i * 0.1);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.35);
        osc.start(ctx.currentTime + i * 0.1);
        osc.stop(ctx.currentTime + i * 0.1 + 0.4);
      });
    } else if (type === 'click') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.2);
    }
  } catch (e) {
    console.error("AudioContext error:", e);
  }
}

  const cents=Number((val*100).toFixed(6));

};

const dd=d=>d.split("-").reverse().join(".");
function isoWeek(ds){const d=new Date(ds+"T00:00:00");const t=new Date(d);t.setHours(0,0,0,0);
  t.setDate(t.getDate()+3-((d.getDay()+6)%7));const w1=new Date(t.getFullYear(),0,4);
  return 1+Math.round(((t-w1)/864e5-3+((w1.getDay()+6)%7))/7);}
function acariMissed(){const items=anItems(),a=items.find(it=>/acarizax/i.test(it.t||""));if(!a)return [];
  const used={},taken={},today=iso(new Date());
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
    if(k&&k.indexOf("fam.anchk.")===0){const [date,id]=k.slice(10).split("|");used[date]=1;if(id===a.id)taken[date]=1;}}
  return Object.keys(used).filter(d=>d<today&&!taken[d]).sort();}

// Tải file CHẮC CHẮN: gắn anchor vào DOM (nhiều trình duyệt/WebView bỏ qua nếu không gắn);
// nếu môi trường không hỗ trợ tải (WebView) -> mở blob ở tab mới để lưu tay.
function downloadFile(filename,content,mime){
  let url;
  try{url=URL.createObjectURL(new Blob([content],{type:mime}));}catch(e){return false;}
  const a=document.createElement("a");
  if("download" in a){a.href=url;a.download=filename;a.rel="noopener";a.style.display="none";
    document.body.appendChild(a);a.click();
    setTimeout(()=>{try{document.body.removeChild(a);}catch(e){}URL.revokeObjectURL(url);},2000);return true;}
  const w=window.open(url,"_blank");setTimeout(()=>URL.revokeObjectURL(url),5000);return !!w;}
function csvExport(){
  const rows=[["Datum","Kategorie","Wert","Detail","Notiz"]];
  ld("fam.health.logs").forEach(x=>{
    if(x.type==="nose")rows.push([x.date,"Nasenbluten",x.amount,x.duration+(x.side?" / "+x.side:""),x.note||""]);
    else if(x.type==="pain")rows.push([x.date,"Schmerz",x.part,"Stärke "+x.level,x.note||""]);
    else rows.push([x.date,"Stimmung",x.mood,"",x.note||""]);});
  ld("fam.temp").forEach(x=>rows.push([x.date,"Temperatur",x.v+"°C",x.v>=38?"Fieber":"",x.note||""]));
  ld("fam.sleep").forEach(x=>rows.push([x.date,"Schlaf",(durH(x.bed,x.wake)||"")+" h",(x.bed||"")+"-"+(x.wake||""),(x.quality||"")+(x.note?" / "+x.note:"")]));
  ld("fam.growth").forEach(x=>rows.push([x.date,"Wachstum",(x.w||"")+" kg",(x.h||"")+" cm",""]));
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  downloadFile("Gesundheitsbericht_"+iso(new Date())+".csv","﻿"+csv,"text/csv;charset=utf-8");}

function migrateKid(){
  const raw=kidRaw();
  if(raw.v===2)return; // đã migrate — không chạy lại
  const out={};
  out.avatar=raw.avatar||"🦊";out.color=raw.color||"#5fd08a";

/* --- Tính lãi tiền gửi (2%/năm) --- */
function checkPocketMoneyInterest() {
  const s = kidState();
  const today = new Date();
  if (!s.interestLastDate) {
    s.interestLastDate = iso(today);
    s.pocketMoneyAccruedInterest = s.pocketMoneyAccruedInterest || 0;
    kidSave(s);
    return;
  }
  const lastDate = new Date(s.interestLastDate + "T00:00:00");
  const temp = new Date(lastDate);
  temp.setDate(temp.getDate() + 1);
  temp.setHours(0, 0, 0, 0);
  const end = new Date(today);
  end.setHours(0, 0, 0, 0);

  let currentBalance = s.pocketMoney || 0;
  let accrued = s.pocketMoneyAccruedInterest || 0;
  let changed = false;
  let lastCalc = new Date(lastDate);

  while (temp <= end) {
    const dailyInterest = currentBalance > 0 ? (currentBalance * 0.02 / 365) : 0;
    accrued += dailyInterest;

    if (temp.getMonth() !== lastCalc.getMonth()) {
      if (accrued > 0) {
        currentBalance += accrued;
        s.keoLog.unshift({
          date: iso(temp),
          delta: Number(accrued.toFixed(4)),
          reason: LANG === "vi" ? `Nhập gốc lãi tiết kiệm tháng ${lastCalc.getMonth() + 1}/${lastCalc.getFullYear()} (2%/năm)` : `Zinsgutschrift für ${lastCalc.getMonth() + 1}/${lastCalc.getFullYear()} (2%/Jahr)`,
          cur: "euro"
        });
        accrued = 0;
      }
    }

    lastCalc.setTime(temp.getTime());
    temp.setDate(temp.getDate() + 1);
    changed = true;
  }

  if (changed) {
    s.pocketMoney = Number(currentBalance.toFixed(4));
    s.pocketMoneyAccruedInterest = Number(accrued.toFixed(4));
    s.interestLastDate = iso(today);
    kidSave(s);
  }
}

/* ============ Sao lưu + Nhập (backup app này HOẶC export /lich) ============ */
const isMetaKey=k=>k.indexOf("fam.snap")===0||k.indexOf("fam.exports")===0;
function famDump(){const o={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);
  if(k&&k.indexOf("fam.")===0&&!isMetaKey(k))o[k]=localStorage.getItem(k);}return o;}
// Lưu 1 bản copy mỗi lần Xuất (trình duyệt không đọc lại file đã tải -> giữ bản trong máy để khôi phục).
function pushExport(dumpObj){const a=ld("fam.exports"),now=new Date();
  const p=n=>String(n).padStart(2,"0");
  a.push({ts:Date.now(),label:p(now.getDate())+"/"+p(now.getMonth()+1)+" "+p(now.getHours())+":"+p(now.getMinutes()),data:dumpObj});
  while(a.length>12)a.shift();sv("fam.exports",a);}
// Nhập thông minh: key "fam.*" giữ nguyên; key "lich.*" đổi tiền tố sang "fam.*" (bỏ lich.pinok).
function famRestore(o){let n=0;Object.keys(o).forEach(k=>{
  if(k.indexOf("fam.")===0){localStorage.setItem(k,o[k]);n++;}
  else if(k.indexOf("lich.")===0){if(k==="lich.pinok")return;localStorage.setItem("fam."+k.slice(5),o[k]);n++;}});
  return n;}
function snaps(){const a=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf("fam.snap.")===0)a.push(k.slice(9));}return a.sort().reverse();}
function autoSnapshot(){const today=iso(new Date());if(localStorage.getItem("fam.snap_last")===today)return;
  localStorage.setItem("fam.snap."+today,JSON.stringify(famDump()));localStorage.setItem("fam.snap_last",today);
  snaps().slice(7).forEach(d=>localStorage.removeItem("fam.snap."+d));}
function exportFile(){const dump=famDump();
  const ok=downloadFile("gia-dinh-backup-"+iso(new Date())+".json",JSON.stringify(dump,null,2),"application/json");
  pushExport(dump);
  localStorage.setItem("fam.lastexport",iso(new Date()));
  if(!ok)alert(L().dlBlocked);
  return ok;}
function importFile(ev){const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{let o;try{o=JSON.parse(r.result);}catch(e){alert(L().importErr);return;}
    if(!o||typeof o!=="object"){alert(L().importErr);return;}
    const n=famRestore(o);if(!n){alert(L().importNone);return;}renderAll();alert(L().importOk+" ("+n+")");};
  r.readAsText(f);ev.target.value="";}
function renderBackupReminder(){const el=$("backupReminder"),le=localStorage.getItem("fam.lastexport");
  if(!le){el.hidden=false;el.textContent=L().backupNever;return;}
  const days=Math.round((new Date(iso(new Date())+"T00:00:00")-new Date(le+"T00:00:00"))/864e5);
  if(days>=3){el.hidden=false;el.textContent=L().backupRemind(days);}else el.hidden=true;}
function openCog(){
  const last=localStorage.getItem("fam.snap_last");
  const le=localStorage.getItem("fam.lastexport");
  const days=le?Math.round((new Date(iso(new Date())+"T00:00:00")-new Date(le+"T00:00:00"))/864e5):null;
  const warn=(days===null||days>=3);
  const snapList=snaps().slice(0,7).map(d=>`<div class="row" style="display:flex;justify-content:space-between;align-items:center"><span>📦 ${d.split("-").reverse().join("/")}</span><button class="chip" data-restore="${d}">↩</button></div>`).join("")||`<div class="row" style="color:var(--mut)">—</div>`;
  const exps=ld("fam.exports").slice().reverse();
  const expList=exps.length?exps.map(e=>`<div class="row" style="display:flex;justify-content:space-between;align-items:center"><span>⬇️ ${e.label}</span><span style="display:flex;gap:6px"><button class="chip" data-exprestore="${e.ts}">↩</button><button class="chip" data-expdel="${e.ts}" style="color:var(--r)">✕</button></span></div>`).join(""):`<div class="row" style="color:var(--mut)">—</div>`;
  open(`<h3>💾 ${L().backupT}</h3>
    <div style="font-size:13px;color:#c7ccd6;margin-bottom:8px">${L().autoOn}<br>${L().lastSnap}: <b>${last?last.split("-").reverse().join("/"):"–"}</b></div>
    ${warn?`<div class="mockbanner" style="margin:0 0 10px">${L().backupWarn}</div>`:""}
    <div class="acts" style="margin-top:0"><button class="cancel" id="bImp">📂 ${L().importFile}</button><button class="save" id="bExp">⬇️ ${L().exportFile}</button></div>
    <div style="font-size:12px;color:var(--mut);margin-top:6px;display:flex;justify-content:space-between"><span>📊 ${L().storageUsage}: <b>${getStorageUsage().kb} KB / 5000 KB (${getStorageUsage().pct}%)</b></span></div>
    <div class="lbl" style="margin-top:14px">${L().pasteT}</div>
    <textarea id="ioBox" placeholder="${L().pastePh}" style="font:12px/1.4 monospace;min-height:96px"></textarea>
    <div class="acts" style="margin-top:8px"><button class="cancel" id="bIoExp">⬆️ ${L().pasteExport}</button><button class="save" id="bIoImp">⬇️ ${L().pasteImport}</button></div>
    <div class="lbl" id="ioStatus" style="min-height:1.2em;text-transform:none;letter-spacing:0;color:var(--g)"></div>
    <div class="lbl" style="margin-top:10px">${L().expHist}</div><div class="hist">${expList}</div>
    <button class="notebtn" id="bName" style="margin-top:10px">${L().nameSet} — ${CHILD()}</button>
    <div class="lbl" style="margin-top:14px">${KL().nightT}</div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;color:#c7ccd6">
      <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="nOn" style="width:auto;margin:0"> ${KL().nightOn}</label>
      <span style="color:var(--mut)">${KL().nightFrom}</span><input id="nFrom" type="time" style="width:auto;margin:0">
      <span style="color:var(--mut)">${KL().nightTo}</span><input id="nTo" type="time" style="width:auto;margin:0">
    </div>
    <div class="lbl" style="margin-top:14px">${L().snapHist}</div><div class="hist">${snapList}</div>
    <div class="acts"><button class="cancel" id="bClose">${L().cancel}</button></div>`);
  $("bExp").onclick=()=>{exportFile();renderBackupReminder();openCog();};
  $("bImp").onclick=()=>$("impFile").click();
  $("bIoExp").onclick=()=>{$("ioBox").value=JSON.stringify(famDump(),null,2);$("ioBox").select();
    localStorage.setItem("fam.lastexport",iso(new Date()));renderBackupReminder();$("ioStatus").style.color="var(--g)";$("ioStatus").textContent=L().pasteCopied;};
  $("bIoImp").onclick=()=>{const v=$("ioBox").value.trim();
    if(!v){$("ioStatus").style.color="var(--o)";$("ioStatus").textContent=L().pasteEmpty;return;}
    let o;try{o=JSON.parse(v);}catch(e){$("ioStatus").style.color="var(--r)";$("ioStatus").textContent=L().importErr;return;}
    if(!o||typeof o!=="object"){$("ioStatus").style.color="var(--r)";$("ioStatus").textContent=L().importErr;return;}
    const n=famRestore(o);if(!n){$("ioStatus").style.color="var(--r)";$("ioStatus").textContent=L().importNone;return;}
    renderAll();$("ioStatus").style.color="var(--g)";$("ioStatus").textContent=L().pasteOk(n);};
  $("bName").onclick=()=>{const v=prompt(L().nameAsk,CHILD());if(v!==null){if(v.trim())localStorage.setItem("fam.childname",v.trim());else localStorage.removeItem("fam.childname");renderAll();openCog();}};
  (()=>{const nc=nightCfg();$("nOn").checked=nc.on;$("nFrom").value=nc.from;$("nTo").value=nc.to;
    const sN=()=>nightSave({on:$("nOn").checked,from:$("nFrom").value||"23:00",to:$("nTo").value||"06:00"});
    $("nOn").onchange=sN;$("nFrom").onchange=sN;$("nTo").onchange=sN;})();
  $("bClose").onclick=close;
  sheet.querySelectorAll("[data-restore]").forEach(b=>b.onclick=()=>{if(confirm(L().restoreAsk)){const s=localStorage.getItem("fam.snap."+b.dataset.restore);if(s){famRestore(JSON.parse(s));renderAll();}close();}});
  sheet.querySelectorAll("[data-exprestore]").forEach(b=>b.onclick=()=>{if(confirm(L().restoreAsk)){const e=ld("fam.exports").find(x=>String(x.ts)===b.dataset.exprestore);if(e&&e.data){famRestore(e.data);renderAll();}close();}});
  sheet.querySelectorAll("[data-expdel]").forEach(b=>b.onclick=()=>{sv("fam.exports",ld("fam.exports").filter(x=>String(x.ts)!==b.dataset.expdel));openCog();});}

/* ============ Acarizax sắp hết (tự nhắc) ============ */
function acari(){const v=localStorage.getItem("fam.acari");if(v){try{return JSON.parse(v)}catch(e){}}return null;}
function acariRemain(s){if(!s)return 0;const days=Math.max(0,Math.round((new Date(iso(new Date())+"T00:00:00")-new Date(s.since+"T00:00:00"))/864e5));return Math.max(0,s.count-(s.perDay||2)*days);}
const acariDaysLeft=s=>s?Math.floor(acariRemain(s)/(s.perDay||2)):0;
function renderAcari(){const s=acari();$("h_acari").textContent=L().acariH;$("acariUnit").textContent=L().acariUnit;
  $("acariBuy").textContent=s?L().acariBuy:L().acariSet;
  $("acariDays").textContent=s?acariDaysLeft(s):"–";
  $("acariBreak").textContent=s?L().acariBreak(acariRemain(s),s.perDay||2):L().acariSetup;}
function renderAcariReminder(){const el=$("acariReminder"),s=acari();
  if(s&&acariDaysLeft(s)<=14){el.hidden=false;el.textContent=L().acariRemind(acariDaysLeft(s));}else el.hidden=true;}
function acariBuyFn(){const s0=acari();const v=prompt(L().acariAsk,"4");if(v===null)return;const boxes=parseFloat(v);if(!boxes)return;
  const ppb=parseFloat(prompt(L().acariPpb,"30"))||30;
  let perDay=s0?(s0.perDay||2):2;if(!s0){const pd=parseFloat(prompt(L().acariPerDay,"2"));if(pd&&pd>0)perDay=pd;}
  const s={count:Math.round(boxes*ppb)+acariRemain(s0),perDay,since:iso(new Date())};
  localStorage.setItem("fam.acari",JSON.stringify(s));renderAll();}

function getMoneyHistory(s) {
  let bal = s.pocketMoney || 0;
  const points = [{ date: iso(new Date()), bal: bal }];
  const logs = (s.keoLog || []).filter(x => x.cur === "euro").slice(0, 5);
  for (const log of logs) {
    bal -= log.delta;
    points.push({ date: log.date, bal: bal });
  }
  points.reverse();
  return points;
}
function renderMoneyChart(s) {
  const history = getMoneyHistory(s);
  const maxBal = Math.max(...history.map(p => p.bal), 1);
  const minBal = Math.min(...history.map(p => p.bal), 0);
  const range = maxBal - minBal || 1;
  const barsHtml = history.map(p => {
    const height = Math.max(5, Math.min(60, Math.round(((p.bal - minBal) / range) * 60))) + 10;
    const displayDate = p.date.split("-").reverse().slice(0, 2).join("/");
    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
      <div style="font-size:10px;color:#9fe0b0;font-weight:700">€${p.bal.toFixed(2)}</div>
      <div style="width:100%;height:${height}px;background:linear-gradient(to top,#102a1e,#5fd08a);border-radius:4px;border:1px solid #3a5a40"></div>
      <div style="font-size:10px;color:var(--mut)">${displayDate}</div>
    </div>`;
  }).join("");
  return `<div class="kidsec" style="margin-top:14px">${KL().moneyHistoryT}</div>
    <div style="background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 10px;display:flex;align-items:flex-end;gap:12px;height:120px;margin-top:6px">
      ${barsHtml}
    </div>`;
}

  $("mgReset").onclick=()=>{resetPoints();if($("mgBody"))renderManageBody();};
  $("mgClose").onclick=close;}
function renderManageBody(){
  const s=kidState();
  const row=(nm,tok)=>`<div class="chk" style="cursor:default"><span class="nm">${nm}</span>
    <span class="ic" data-mgedit="${tok}">✏️</span><span class="ic" data-mgdel="${tok}">✕</span></div>`;
  const sec=(title,rowsHtml,addKind,addLabel)=>`<div class="lbl" style="margin-top:14px">${title}</div>
    ${rowsHtml||`<div class="empty">${L().mgEmpty}</div>`}
    <button class="add" data-mgadd="${addKind}">${addLabel}</button>`;
  const t0=new Date();t0.setHours(0,0,0,0);
  $("mgBody").innerHTML=
     sec(L().mgSecCheck, anItems().map(c=>row(T_val(c.t),"check:"+c.id)).join(""), "check", L().mgAddCheck)
    +sec(L().mgSecSaoAdjust, saoAdjusts().map(adj => row(`${adj.emoji || '⭐'} ${adj.text} / ${adj.textDe || adj.text} · <b style="color:${adj.delta < 0 ? 'var(--r)' : 'var(--g)'}">${adj.delta > 0 ? '+' : ''}${adj.delta}⭐</b>`, "saoadj:" + adj.id)).join(""), "saoadj", L().mgAddSaoAdjust)
    +sec(L().mgSecGoal, s.goals.map(g=>row(`${g.emoji||'🎯'} ${T_val(g.text)}`,"goal:"+g.id)).join(""), "goal", L().mgAddGoal)
    +sec(L().mgSecShop, s.shop.map(it=>row(`${it.e} ${T_val(it.name)} · <b style="color:${it.cur==='sao'?'var(--y)':'#c99bff'}">${it.cost}${it.cur==='sao'?'⭐':'🍬'}</b>`,"shop:"+it.id)).join(""), "shop", L().mgAddShop)
    +sec(L().mgSecTier, s.tiers.slice().sort((a,b)=>a.t-b.t).map(b=>row(`${b.e} ${T_val(b.name)} · ${b.t}⭐ · +${b.bonus}🍬${b.reward?' · 🎁 '+b.reward:''}`,"tier:"+b.id)).join(""), "tier", L().mgAddTier)
    +sec(L().mgSecChore, chores().map(c=>row(c.t,"chore:"+c.id)).join(""), "chore", L().mgAddChore)
    +sec(L().mgSecAppt, dlItems().map(x=>row(x.t+" · "+x.d.split("-").reverse().join("/"),"appt:"+x.id)).join(""), "appt", L().mgAddAppt);
  document.querySelectorAll("[data-mgadd]").forEach(b=>b.onclick=()=>mgAdd(b.dataset.mgadd));
  document.querySelectorAll("[data-mgedit]").forEach(b=>b.onclick=()=>mgEdit(b.dataset.mgedit));
  document.querySelectorAll("[data-mgdel]").forEach(b=>b.onclick=()=>mgDel(b.dataset.mgdel));
}
function mgAdd(kind){
  if(kind==="saoadj")addSaoAdjPrompt();
  else if(kind==="check")addAnItemPrompt();
  else if(kind==="goal")addGoalPrompt();
  else if(kind==="shop")addShopPrompt();
  else if(kind==="tier")addTierPrompt();
  else if(kind==="chore")addChore();
  else if(kind==="appt")addApptPrompt();
  if($("mgBody"))renderManageBody();}
function mgEdit(tok){const[t,id]=tok.split(":");
  if(t==="saoadj")editSaoAdjPrompt(id);
  else if(t==="check")editAnItemPrompt(id);
  else if(t==="goal")editGoalPrompt(id);
  else if(t==="shop")editShopPrompt(id);
  else if(t==="tier")editTierPrompt(id);
  else if(t==="chore")editChore(id);
  else if(t==="appt")editApptPrompt(id);
  if($("mgBody"))renderManageBody();}
function mgDel(tok){const[t,id]=tok.split(":");
  if(t==="saoadj")delSaoAdjPrompt(id);
  else if(t==="check")delAnItemPrompt(id);
  else if(t==="goal")delGoalPrompt(id);
  else if(t==="shop")delShopPrompt(id);
  else if(t==="tier")delTierPrompt(id);
  else if(t==="chore")delChore(id);
  else if(t==="appt")delEvent(id);
  if($("mgBody"))renderManageBody();}
/* --- Tối ban đêm (tự chuyển theo giờ) --- */
let manualNight=false,wakeUntil=0;
function nightCfg(){try{const c=JSON.parse(localStorage.getItem("fam.night"));if(c){const res=Object.assign({on:true,from:"23:00",to:"06:00"},c);if(res.from==="21:30")res.from="23:00";if(res.to==="06:30")res.to="06:00";return res;}}catch(e){}return {on:true,from:"23:00",to:"06:00"};}
function nightSave(c){localStorage.setItem("fam.night",JSON.stringify(c));}
function inWin(now,from,to){const m=now.getHours()*60+now.getMinutes(),f=from.split(":").map(Number),t=to.split(":").map(Number),a=f[0]*60+f[1],b=t[0]*60+t[1];return a<=b?(m>=a&&m<b):(m>=a||m<b);}
function showNight(){const now=new Date();
  $("nightClock").textContent=String(now.getHours()).padStart(2,"0")+":"+String(now.getMinutes()).padStart(2,"0");
  $("nightDate").textContent=DAYN[now.getDay()]+" · "+iso(now).split("-").reverse().join("/");
  $("nightHint").textContent=KL().nightHint;$("night").hidden=false;}
function tickNight(){
  if(TAB==="kid"||!$("ov").hidden){$("night").hidden=true;return;}   // đang dùng (tab con / popup) -> không tối
  const c=nightCfg(),now=new Date();
  if(manualNight||(c.on&&inWin(now,c.from,c.to)&&Date.now()>=wakeUntil))showNight();else $("night").hidden=true;}

  document.querySelectorAll("[data-lang]").forEach(x=>x.classList.toggle("on",x.dataset.lang===LANG));renderAll();});

tickNight();setInterval(()=>{if(!$("night").hidden&&(TAB!=="kid"&&$("ov").hidden))showNight();tickNight();},120000);
/* ============ Tự làm mới: đổi ngày → renderAll() · re-render khi sáng màn/focus · hard reload ~06:00 ============ */
let _lastDate=iso(new Date()),_reloaded6=false;
function checkDateChange(){const now=iso(new Date());if(now!==_lastDate){_lastDate=now;checkPocketMoneyAllowance();checkPocketMoneyInterest();renderAll();}}
function autoRefreshTick(){
  checkDateChange();
  const now=new Date();
  if(!_reloaded6&&now.getHours()===6&&$("night").hidden&&document.visibilityState==="visible"){_reloaded6=true;location.reload();}
  if(now.getHours()!==6)_reloaded6=false;
}
setInterval(autoRefreshTick,300000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){checkDateChange();}});
window.addEventListener("focus",()=>{checkDateChange();});
/* ============ PWA: đăng ký service worker (offline) ============ */
function showUpdateBanner() {
  const el = $("swUpdateReminder");
  if (el) {
    el.textContent = L().swUpdate;
    el.hidden = false;
  }
}
/* ============ PWA: đăng ký service worker (offline) ============ */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound", () => {
        const newWorker = reg.installing;
        newWorker.addEventListener("statechange", () => {
          if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
            showUpdateBanner();
          }
        });
      });
      if (reg.waiting) {
        showUpdateBanner();
      }
    }).catch(()=>{});
  });
}
